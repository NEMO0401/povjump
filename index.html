/* Layout: full-bleed 3D stage, HUD strip along the top, instruction card on the left over the scene.
   Look: toy-diorama daylight, pixel Japanese type for title and numbers, rounded body face for reading. */
:root {
  --ink: #141a3a;
  --ink-2: #1f2a5c;

  --sun: #ffc93c;

  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; background: var(--sky); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#view { display: block; width: 100%; height: 100%; outline: none; }

[hidden] { display: none !important; }
.hud, .overlay {
  position: absolute; inset: 0;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud { pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
.topwrap { display: flex; flex-direction: column; gap: 6px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 26px; color: #fff; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.lab { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-shadow: 0 2px 0 rgba(20,26,58,.7); }
.val { font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(20,26,58,.7), 0 0 10px rgba(20,26,58,.35); }
.val .coin { display: inline-block; width: 13px; height: 13px; margin-right: 6px; border-radius: 50%; background: var(--sun); box-shadow: inset -3px -3px 0 var(--sun-deep), 0 0 0 2px var(--ink); vertical-align: -1px; }
.chip { margin-left: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: rgba(20,26,58,.78); font-weight: 800; font-size: 13px; color: var(--paper); }
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #9aa6d8; }
.chip[data-s="1"]::before { background: var(--berry); }
.chip[data-s="fire"]::before { background: var(--flame); box-shadow: 0 0 8px var(--flame); }
.chip[data-s="ice"]::before { background: #7fd8ff; box-shadow: 0 0 8px #7fd8ff; }
.chip[data-s="whip"]::before { background: #4fbf55; box-shadow: 0 0 8px #4fbf55; }

.reds i.on { background: #e0243a; box-shadow: inset 0 0 0 2px #ffd84a; }
.buffs { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.buff { padding: 3px 10px; border-radius: 999px; background: rgba(20,26,58,.78); font-size: 12px; font-weight: 800; color: var(--paper); box-shadow: inset 0 0 0 2px rgba(255,247,227,.35); }
.buff.star { box-shadow: inset 0 0 0 2px #ffd84a; color: #ffd84a; }
.buff.sticky { box-shadow: inset 0 0 0 2px #8ae04a; }
.behind { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); padding: 6px 16px; border-radius: 999px; background: rgba(255,59,92,.88); color: #fff; font-family: var(--f-display); font-size: 22px; opacity: 0; pointer-events: none; }
.behind::before { content: "▼ "; }
.behind.on { opacity: 1; animation: pulse .3s infinite alternate; }
.ink { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at 30% 40%, rgba(27,22,48,.97) 0 22%, transparent 23%), radial-gradient(circle at 62% 55%, rgba(27,22,48,.95) 0 26%, transparent 27%), radial-gradient(circle at 45% 75%, rgba(27,22,48,.92) 0 18%, transparent 19%), radial-gradient(circle at 75% 25%, rgba(27,22,48,.9) 0 14%, transparent 15%); transition: opacity .3s; }
.tint { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; }
.tint.poison { opacity: 1; background: radial-gradient(ellipse at center, rgba(160,255,60,0) 45%, rgba(160,255,60,.45) 100%); }

.starfx { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 0 6px #ff5d5d, inset 0 0 0 12px #ffe14a, inset 0 0 0 18px #6fdc6a, inset 0 0 0 24px #5ab6ff, inset 0 0 40px 24px rgba(215,123,255,.5); }

.cross { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; border: 2px solid rgba(255,255,255,.92); box-shadow: 0 0 0 1px rgba(20,26,58,.55); opacity: 0; }
.cross.on { opacity: 1; }
.toast { position: absolute; left: 50%; top: 24%; transform: translate(-50%, 8px); width: max-content; max-width: 90%; text-align: center; font-family: var(--f-display); font-size: 26px; color: #fff; text-shadow: 0 3px 0 rgba(20,26,58,.8), 0 0 14px rgba(20,26,58,.5); opacity: 0; transition: opacity .2s, transform .2s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.keysbar { align-self: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; padding: 7px 14px; border-radius: 10px; background: rgba(20,26,58,.62); font-size: 12px; font-weight: 800; }
.keysbar span { display: inline-flex; align-items: center; gap: 5px; }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,60,90,0) 40%, rgba(255,60,90,.7) 100%); }
.flash.on { animation: flash .55s ease-out; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.stunfx { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,201,60,0) 30%, rgba(255,201,60,.6) 100%); }
.stunfx.on { opacity: 1; animation: pulse .45s infinite alternate; }
.stunfx span { position: absolute; left: 50%; top: 34%; transform: translateX(-50%); width: max-content; font-family: var(--f-display); font-size: 30px; color: #fff; text-shadow: 0 3px 0 rgba(20,26,58,.85); }
@keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.45); } }

kbd { font-family: var(--f-display); min-width: 26px; height: 26px; padding: 0 6px; box-sizing: border-box; display: inline-grid; place-items: center; background: var(--paper); color: var(--ink); border-radius: 6px; font-size: 14px; box-shadow: 0 3px 0 #c9b98f; }
.keysbar kbd { min-width: 22px; height: 22px; font-size: 12px; box-shadow: 0 2px 0 #c9b98f; }

.overlay { display: flex; align-items: center; justify-content: flex-start; background: linear-gradient(90deg, rgba(20,26,58,.55), rgba(20,26,58,0) 70%); }
.overlay.center { justify-content: center; background: rgba(20,26,58,.5); }
.card { width: 100%; max-width: 440px; box-sizing: border-box; padding: 26px 28px 24px; border-radius: 14px; background: rgba(20,26,58,.9); box-shadow: 0 10px 40px rgba(0,0,0,.35); max-height: 100%; overflow-y: auto; touch-action: pan-y; }
.eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 800; letter-spacing: .18em; color: var(--leaf); }
h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 64px; line-height: 1.05; color: var(--sun); text-shadow: 3px 3px 0 var(--berry), 6px 6px 0 var(--ink-2); text-wrap: balance; }
h2 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 400; font-size: 38px; color: var(--sun); text-wrap: balance; }
.lead { margin: 14px 0 18px; line-height: 1.7; max-width: 34em; }
.keys { display: grid; gap: 9px; margin: 0 0 20px; }
.keys > div { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 10px; font-size: 14px; }
.kc { display: inline-flex; align-items: center; gap: 4px; }
.kc i { font-style: normal; opacity: .75; }
.btn { font-family: var(--f-display); font-size: 21px; background: var(--sun); color: var(--ink); border: 0; padding: 12px 30px; border-radius: 10px; box-shadow: 0 4px 0 var(--sun-deep); cursor: pointer; pointer-events: auto; }
.btn:hover { background: #ffd65e; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sun-deep); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn.sub { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px rgba(255,247,227,.5); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn.sns { font-size: 15px; padding: 9px 16px; background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px rgba(255,247,227,.5); text-decoration: none; display: inline-flex; align-items: center; }
.btn.sns.x { background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 #c9b98f; }
.share { margin-top: 18px; padding-top: 12px; border-top: 1px solid rgba(255,247,227,.2); }
.share .small { margin: 0 0 8px; }
.xprev { display: grid; grid-template-columns: 168px 1fr; gap: 12px; align-items: start; margin-top: 12px; }
.xprev img { width: 168px; aspect-ratio: 16 / 9; border-radius: 8px; background: rgba(255,247,227,.08); box-shadow: 0 6px 18px rgba(0,0,0,.35); object-fit: cover; -webkit-touch-callout: default; pointer-events: auto; user-select: auto; }
.xprev .small { margin: 0 0 8px; }
@media (max-width: 460px) { .xprev { grid-template-columns: 1fr; } .xprev img { width: 100%; } }
.cardimg { display: block; width: 120px; margin: 12px 0 0; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.35); -webkit-touch-callout: default; pointer-events: auto; user-select: auto; }
#cardOut a { color: var(--sun); }
.updnote { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; background: rgba(92,214,140,.14); box-shadow: inset 0 0 0 2px rgba(92,214,140,.5); font-size: 14px; }
.updnote ul { margin: 6px 0 0; padding-left: 1.2em; }
.updnote li { margin: 2px 0; }
.invite { display: grid; gap: 6px; margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; background: rgba(255,201,60,.14); box-shadow: inset 0 0 0 2px rgba(255,201,60,.5); }
.invite .btn { justify-self: start; font-size: 17px; padding: 9px 18px; }
.set + .small { margin-bottom: 18px; }
.set { display: grid; gap: 14px; margin: 14px 0 4px; }

.srow b { font-family: var(--f-display); font-weight: 400; font-size: 18px; color: var(--sun); text-align: right; }
.srow input[type=range] { width: 100%; height: 32px; margin: 0; accent-color: var(--sun); touch-action: pan-y; }
.srow input[type=checkbox] { width: 26px; height: 26px; margin: 0; accent-color: var(--sun); justify-self: start; }
.srow:has(input[type=checkbox]) { grid-template-columns: 9.5em 1fr; }
@media (max-width: 460px) { .srow { grid-template-columns: 1fr 3em; } .srow label { grid-column: 1 / -1; } .srow input[type=range] { grid-column: 1; } .srow:has(input[type=checkbox]) { grid-template-columns: 1fr 34px; } .srow:has(input[type=checkbox]) label { grid-column: 1; } }
.small { margin: 14px 0 0; font-size: 12px; opacity: .8; line-height: 1.6; }
.hint { margin: 0 0 16px; padding: 8px 12px; border-radius: 8px; background: rgba(255,93,134,.22); font-weight: 800; font-size: 14px; }
.result { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; margin: 14px 0 20px; font-size: 15px; }
.result b { font-family: var(--f-display); font-weight: 400; font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.result .hi b { color: var(--sun); }

.touchui, .pausebtn { display: none; }
.touch .touchui { display: block; }
.touch .pausebtn { display: grid; }
.touch .keysbar { display: none; }
.touch .top { padding-right: 52px; }
.stick { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px)); width: 150px; height: 150px; border-radius: 50%; background: rgba(20,26,58,.5); box-shadow: inset 0 0 0 2px rgba(255,247,227,.35); pointer-events: auto; touch-action: none; transition: box-shadow .12s; }
.stick.dash { box-shadow: inset 0 0 0 4px rgba(255,138,31,.95), 0 0 14px rgba(255,138,31,.55); }
.stick .arw { position: absolute; font-size: 12px; line-height: 1; color: rgba(255,247,227,.7); pointer-events: none; }
.stick .a-u { top: 9px; left: 50%; transform: translateX(-50%); }
.stick .a-d { bottom: 9px; left: 50%; transform: translateX(-50%); }
.stick .a-l { left: 9px; top: 50%; transform: translateY(-50%); }
.stick .a-r { right: 9px; top: 50%; transform: translateY(-50%); }
.knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--paper); box-shadow: 0 4px 0 #c9b98f; transform: translate(var(--kx, 0px), var(--ky, 0px)); pointer-events: none; }
.knob.dash { background: var(--flame); box-shadow: 0 4px 0 #b25a00; }
.tbtn { position: absolute; border: 0; border-radius: 50%; font-family: var(--f-display); color: var(--ink); pointer-events: auto; touch-action: none; padding: 0; }
.tbtn.jump { width: 96px; height: 96px; font-size: 20px; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 12px)); background: var(--sun); box-shadow: 0 5px 0 var(--sun-deep); }
.tbtn.fire { width: 70px; height: 70px; font-size: 14px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 108px); bottom: max(50px, calc(env(safe-area-inset-bottom, 0px) + 40px)); background: var(--flame); box-shadow: 0 4px 0 #b25a00; }
.tbtn.off { opacity: .35; }
.tbtn.fire[data-p="ice"] { background: #7fd8ff; box-shadow: 0 4px 0 #3a8fb0; }
.tbtn.fire[data-p="whip"] { background: #5fd068; box-shadow: 0 4px 0 #2f8f3a; }
.tbtn.down { transform: translateY(3px); filter: brightness(1.1); }
.pausebtn { position: absolute; top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(20,26,58,.72); color: var(--paper); font-family: var(--f-display); font-size: 15px; place-items: center; pointer-events: auto; touch-action: none; padding: 0; }
.keys.t > div { grid-template-columns: 104px 1fr; }

@media (prefers-reduced-motion: reduce) {
  .flash.on { animation: none; opacity: 0; }

}

<body>
<div id="app">
  <canvas id="view" tabindex="0"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="topwrap">
      <div class="top">
        <div class="stat"><span class="lab"><span data-t="ステージ">ステージ</span> <span class="themetag" id="hTheme">もり</span></span><span class="val"><span id="hStage">1</span><span class="reds" id="hReds"></span></span></div>

    return '<option value="' + p[0] + '"' + (p[0] === LANG ? ' selected' : '') + '>' + p[1] + '</option>';
  }).join('') + '</select></label>';
}
/* 日付を、その言語の書き方で */
function fmtDate(iso) {
  try { const a = iso.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]).toLocaleDateString(LANG_TAG[LANG], { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return iso; }
}

/* ================= 3Dモデル(ChatGPTで作ったGLBを1つのファイルにまとめたもの) ================= */
/* models.bin = [u32 ヘッダ長][JSONヘッダ][int16 位置 / uint16 インデックス]。向きはゲーム用(正面 -Z)に変換済み。配信は base64 にした models.json */
const MODELS = { ready: false, failed: false, H: null, buf: null, geo: {}, world: {} };
function loadModels() {
  if (typeof fetch !== 'function') { MODELS.failed = true; return Promise.resolve(false); }
  /* models.json = { b64: "models.bin を base64 にした文字列" } */
  return fetch('models.json', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function (o) {
    const bin = atob(o.b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const ab = u8.buffer;
    const hl = new DataView(ab).getUint32(0, true);
    const txt = new TextDecoder().decode(new Uint8Array(ab, 4, hl));
    MODELS.H = JSON.parse(txt); MODELS.buf = ab; MODELS.base = 4 + hl; MODELS.ready = true;
    return true;
  }).catch(function () { MODELS.failed = true; return false; });
}
function hasModel(name) { return MODELS.ready && !!MODELS.H.models[name]; }
const modelMatCache = {};
function modelMat(hex, flags, tint) {
  const key = hex + '|' + flags + '|' + (tint || '');
  if (modelMatCache[key]) return modelMatCache[key];
  let c = new THREE.Color('#' + hex);
  if (tint) c = c.lerp(new THREE.Color(tint), 0.65);
  const o = { color: c };
  if (flags.indexOf('g') >= 0) o.emissive = c.clone().multiplyScalar(0.62);
  if (flags.indexOf('c') >= 0) { o.transparent = true; o.opacity = 0.72; }
  return (modelMatCache[key] = new THREE.MeshLambertMaterial(o));
}
function modelPrimGeo(name, mi, ni, pi) {
  const key = name + '/' + ni + '/' + pi;
  if (MODELS.geo[key]) return MODELS.geo[key];
  const md = MODELS.H.models[name], pr = md.nodes[ni].g[pi];
  const pos16 = new Int16Array(MODELS.buf, MODELS.base + pr.vo, pr.vn * 3);
  const idx = new Uint16Array(MODELS.buf, MODELS.base + pr.io, pr.in);
  const pos = new Float32Array(pos16.length);
  for (let k = 0; k < pos16.length; k++) pos[k] = pos16[k] * md.q;
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(idx), 1));
  if (pr.f) g = g.toNonIndexed();
  g.computeVertexNormals(); g.computeBoundingSphere();
  g.userData.keep = true;
  return (MODELS.geo[key] = g);
}
function nodeMatrix(n) {
  const m = n.m, M4 = new THREE.Matrix4();
  M4.set(m[0], m[3], m[6], m[9], m[1], m[4], m[7], m[10], m[2], m[5], m[8], m[11], 0, 0, 0, 1);
  return M4;
}
/* モデルをノード構造ごと作る。parts[ノード名] で動かせる */
function makeModel(name, opt) {
  opt = opt || {};
  const md = MODELS.H.models[name];
  const root = new THREE.Group(), parts = {}, objs = [];
  md.nodes.forEach(function (n, ni) {
    const o = new THREE.Group();
    nodeMatrix(n).decompose(o.position, o.quaternion, o.scale);
    n.g.forEach(function (pr, pi) {
      const mt = md.mats[pr.c];
      const mm = new THREE.Mesh(modelPrimGeo(name, pr.c, ni, pi), opt.mat || modelMat(mt[0], mt[1], opt.tint));
      mm.userData.mat = mt[2] || '';
      o.add(mm);
    });
    (n.p >= 0 ? objs[n.p] : root).add(o);
    objs.push(o); parts[n.n] = o;
  });
  root.userData.parts = parts;
  return root;
}
/* 同じモデルをたくさん並べる(飾り用)。mats: THREE.Matrix4 の配列 */
function modelWorldMats(name) {
  if (MODELS.world[name]) return MODELS.world[name];
  const md = MODELS.H.models[name], W = [];
  md.nodes.forEach(function (n) { const L = nodeMatrix(n); W.push(n.p >= 0 ? W[n.p].clone().multiply(L) : L); });
  return (MODELS.world[name] = W);
}
function makeInstanced(name, mats, parent) {
  if (!hasModel(name) || !mats.length) return;
  const md = MODELS.H.models[name], W = modelWorldMats(name), tmp = new THREE.Matrix4();
  md.nodes.forEach(function (n, ni) {
    n.g.forEach(function (pr, pi) {
      const mt = md.mats[pr.c];
      const im = new THREE.InstancedMesh(modelPrimGeo(name, pr.c, ni, pi), modelMat(mt[0], mt[1]), mats.length);
      for (let i = 0; i < mats.length; i++) { tmp.multiplyMatrices(mats[i], W[ni]); im.setMatrixAt(i, tmp); }
      im.instanceMatrix.needsUpdate = true;
      im.frustumCulled = false;
      parent.add(im); worldInst.push(im);
    });
  });
}
function trs(x, y, z, ry, s, sy) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion().setFromAxisAngle(UP, ry || 0);
  m.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(s, sy === undefined ? s : sy, s));
  return m;
}
/* モデルを、ゲームの大きさにそろえて包む */
function wrapModel(name, scale, opt) {
  const inner = makeModel(name, opt);
  inner.scale.setScalar(K * scale);
  const g = new THREE.Group(); g.add(inner);
  g.userData = { inner: inner, p: inner.userData.parts };
  return g;
}

/* 中身を「体」用の箱に入れる(伸び縮み・かたむけを、モデルの大きさを崩さずにかけられる) */
function wrapBody(name, scale, opt) {
  const g = wrapModel(name, scale, opt), b = new THREE.Group();
  g.remove(g.userData.inner); b.add(g.userData.inner); g.add(b); g.userData.body = b;
  return g;
}
/* 底が y=0 にくるように持ち上げる(中心が原点のモデル用) */
function sitModel(g) {
  const bx = new THREE.Box3().setFromObject(g);
  if (!bx.isEmpty()) g.userData.inner.position.y -= bx.min.y;
  return g;
}
function itemModel(name, scale) { return hasModel(name) ? sitModel(wrapModel(name, scale)) : null; }
/* 決まった材質の部品だけを集める(光るいなずまを隠す、など) */
function meshesOf(root, mat) { const out = []; root.traverse(function (o) { if (o.isMesh && o.userData.mat === mat) out.push(o); }); return out; }

  const r = rng(seed || 7);

}

  else { e.life = 3; e.vy = 7; const a = Math.random() * 6.28; e.vx = Math.cos(a) * 2; e.vz = Math.sin(a) * 2; e.spin = (Math.random() < 0.5 ? -1 : 1) * 8; }

}

}

function hitEnemy(e, type, dmg, dirx, dirz) {
  if (e.dead) return false;
  const D = DEF[e.kind];
  if (e.kind === 'boss') { if (type === 'fire' || type === 'ice' || type === 'whip') { fireBoss(e, dmg); return true; } return false; }
  if (e.kind === 'mini') { if (type === 'fire' || type === 'ice' || type === 'whip') { fireMini(e, dmg); return true; } return false; }
  if (type === 'star' || type === 'tire' || type === 'shell') {
    if (type === 'shell' && e.giant && e.hp > 1) { e.hp--; e.flash = 0.5; sfx('kick'); return true; }
    kill(e, 'fall', type === 'star' ? 500 : 400); sfx('kick'); return true;
  }
  if (type === 'ice') {
    if (e.kind === 'hinotama') { kill(e, 'fall', 300); return true; }
    if (freeze(e)) { addScore(100); return true; }
    return false;
  }

    if (e.segs <= 0) kill(e, 'fall', 400); else e.h = (0.4 + 0.52 * e.segs) * e.sc;
    return true;
  }
  if (type === 'whip' && (e.kind === 'gdango' || e.kind === 'rdango' || e.kind === 'pata')) {
    if (e.kind === 'pata') { e.kind = 'gdango'; dropWings(e); }
    becomeShell(e); e.mode = 'slide'; e.dx = dirx; e.dz = dirz; e.kickCd = 0.4; addScore(200); sfx('kick'); return true;
  }

    navigator.clipboard.write([new ClipboardItem({ 'image/png': SHARE_IMG.blob })]).then(function () {
      shareMsg(T('画像をコピーしました。Xの投稿画面で貼り付け（⌘V / Ctrl+V）すると、画像が付きます。'));
    }, function () { shareMsg(T('Xの投稿画面を開きました。画像は下の「画像を保存」から保存して添付してください。')); showSaveX(); });

  }
});
ov.addEventListener('change', function (e) {
  if (e.target && (e.target.id === 'sVol' || e.target.id === 'sSens')) saveCfg();
  if (e.target && e.target.id === 'sLang') { const prev = LANG; setLang(e.target.value); if (LANG !== prev) track('lang_change', { lang: LANG }); showOverlay('title'); try { const s = $('sLang'); if (s) s.focus({ preventScroll: true }); } catch (er) {} }
});
window.addEventListener('hashchange', function () { INVITE = readHash(); if (S.mode === 'title') showOverlay('title'); });

/* ================= input ================= */
let hadLock = false, dragging = false;
function pressJump() { jumpBuf = 0.12; P.jumpPressT = clockT; }
window.addEventListener('keydown', function (e) {
  const c = e.code;
  if (inSet) { if (!e.repeat && (c === 'Escape' || c === 'KeyP')) closeSettings(); return; } /* せってい中はスライダーのキー操作を邪魔しない */
  if (c === 'ArrowUp' || c === 'ArrowDown' || c === 'ArrowLeft' || c === 'ArrowRight' || c === 'Space') e.preventDefault();
  if (!e.repeat) {
    if (c === 'KeyD' || c === 'Space') pressJump();
    if (c === 'Escape' || c === 'KeyP') { if (S.mode === 'play') pauseGame(); else if (S.mode === 'pause') act('resume'); }
    if (c === 'Enter') { e.preventDefault(); if (S.mode === 'title') act(INVITE && INVITE.kind === 'challenge' ? 'challenge' : 'start'); else if (S.mode === 'pause') act('resume'); else if (S.mode === 'clear' && HC.clearShown) act(S.play === 'normal' ? 'next' : 'title'); }
    if (c === 'KeyR' && (S.mode === 'over' || S.mode === 'clear' || S.mode === 'pause')) act('restart');
    if (c === 'KeyM') { S.muted = !S.muted; applyVolume(); saveCfg(); if (S.mode === 'play') toast(T(S.muted ? 'おと: オフ' : 'おと: オン'), 900); }
  }
  keys[c] = true;
  if (c === 'Space') keys.KeyD = true;
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; if (e.code === 'Space') keys.KeyD = false; });
window.addEventListener('blur', function () { for (const k in keys) keys[k] = false; if (S.mode === 'play') pauseGame(); });
canvas.addEventListener('mousedown', function () { dragging = true; });
window.addEventListener('mouseup', function () { dragging = false; });
document.addEventListener('mousemove', function (e) {
  if (S.mode !== 'play') return;
  if (document.pointerLockElement === canvas || dragging) {
    P.yaw -= (e.movementX || 0) * 0.0025 * CFG.sens;
    P.pitch = clamp(P.pitch - (e.movementY || 0) * 0.0025 * CFG.sens, -1.3, 1.3);
  }
});
document.addEventListener('pointerlockchange', function () {
  if (document.pointerLockElement === canvas) hadLock = true;
  else { if (hadLock && S.mode === 'play') pauseGame(); hadLock = false; }
});

/* ---------- touch controls ---------- */
let stickId = null, lookId = null, lx = 0, ly = 0;
function setTouch(on) {
  if (IS.touch === on) return;
  IS.touch = on; app.classList.toggle('touch', on);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, on ? 1.5 : 2));
  resize();
  if (!ov.hidden && (S.mode === 'title' || S.mode === 'pause')) showOverlay(S.mode);
}
const STICK_R = 52; /* ノブが動ける半径(px) */
function stickSet(dx, dy) {
  const d = Math.hypot(dx, dy);
  const k = d > STICK_R ? STICK_R / d : 1;
  knob.style.setProperty('--kx', dx * k + 'px');
  knob.style.setProperty('--ky', dy * k + 'px');
  const n = Math.min(1, d / STICK_R);
  const m = n < 0.16 ? 0 : Math.min(1, (n - 0.16) / 0.55);
  const ux = d > 0 ? dx / d : 0, uy = d > 0 ? dy / d : 0;
  joy.x = ux * m; joy.y = -uy * m;
  joy.dash = n > 0.9;
  knob.classList.toggle('dash', joy.dash);
  stick.classList.toggle('dash', joy.dash);
}
function stickPos(e) { const r = stick.getBoundingClientRect(); return [e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)]; }
function releaseTouch() {
  stickId = null; lookId = null; stickSet(0, 0);
  keys.KeyD = false; keys.KeyZ = false;
  tJump.classList.remove('down'); tFire.classList.remove('down');
}
stick.addEventListener('pointerdown', function (e) {
  stickId = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch (_) {}
  const p = stickPos(e); stickSet(p[0], p[1]); e.preventDefault();
});
stick.addEventListener('pointermove', function (e) { if (e.pointerId === stickId) { const p = stickPos(e); stickSet(p[0], p[1]); } });
function endStick(e) { if (e.pointerId === stickId) { stickId = null; stickSet(0, 0); } }
stick.addEventListener('pointerup', endStick);
stick.addEventListener('pointercancel', endStick);
function bindHold(el, code, onDown) {
  el.addEventListener('pointerdown', function (e) {
    keys[code] = true; el.classList.add('down');
    if (onDown) onDown();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  const up = function () { keys[code] = false; el.classList.remove('down'); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}
bindHold(tJump, 'KeyD', pressJump);
bindHold(tFire, 'KeyZ');
tPause.addEventListener('click', function () { pauseGame(); });
app.addEventListener('pointerdown', function (e) { if (e.pointerType === 'touch') setTouch(true); }, true);
canvas.addEventListener('pointerdown', function (e) {
  if (e.pointerType !== 'touch' || S.mode !== 'play' || lookId !== null) return;
  lookId = e.pointerId; lx = e.clientX; ly = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
canvas.addEventListener('pointermove', function (e) {
  if (e.pointerId !== lookId || S.mode !== 'play') return;
  P.yaw -= (e.clientX - lx) * 0.0055 * CFG.sens;
  P.pitch = clamp(P.pitch - (e.clientY - ly) * 0.0045 * CFG.sens, -1.3, 1.3);
  lx = e.clientX; ly = e.clientY;
});
function endLook(e) { if (e.pointerId === lookId) lookId = null; }
canvas.addEventListener('pointerup', endLook);
canvas.addEventListener('pointercancel', endLook);
app.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('visibilitychange', function () { if (document.hidden) { releaseTouch(); pauseGame(); } });

/* ================= main loop ================= */
function update(dt) {
  if (S.mode === 'play') {
    S.timeF -= dt; S.stageT += dt; if (S.timeF <= 0) { S.timeF = 0; die('time'); }
    S.slowT = Math.max(0, S.slowT - dt); S.ink = Math.max(0, S.ink - dt);
    updatePlayer(dt);
    if (S.mode === 'play') updateGims(dt);
    updateBlocks(dt); updateItems(dt); updateEnemies(dt); updateShots(dt); updateFire(dt); updateBarriers(dt);
    if (S.mode === 'play') checkPickups(dt);
  } else if (S.mode === 'dead') {
    P.deadT -= dt;
    P.vy -= 28 * dt; P.y += P.vy * dt;
    updateBlocks(dt);
    if (P.deadT <= 0) {
      if (S.lives > 0) respawn(); else { S.mode = 'over'; showOverlay('over'); }
    }
  } else if (S.mode === 'clear') {
    S.clearT += dt;
    if (Math.random() < dt * 6) { const w = c2w(LV.gateU, -3 + Math.random() * 6); burst(w[0], 7 + Math.random() * 3, w[1], [0xffc93c, 0xff5d86, 0x5fd068, 0x7d6ef2][(Math.random() * 4) | 0], 8, 5, 0.2, 0.9, 6); }
    if (S.clearT > 3 && !HC.clearShown) { HC.clearShown = true; showOverlay('clear'); }
  }
  S.shake = Math.max(0, S.shake - dt * 1.4);
  updateParts(dt); updateRings(dt); fxAmbient(dt); updateFx(dt);
}
function boot() {
  S.seed = (Math.random() * 1e9) >>> 0;
  LV = generateLevel(1, stageSeed(S.seed, 1), S.seed);
  buildWorld();
  showOverlay('title');
}
try { setTouch(!!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)); } catch (e) {}
applyStatic();
boot();
loadModels().then(function () { if (S.mode === 'title') boot(); });

let last = performance.now(), acc = 0;
/* 撮影モード: 動画用に1コマずつ決まった時間だけ進めて描く(普段は使わない) */
const MOVIE = { on: false };
function movieStep(dt, before) {
  clockT += dt;
  if (S.mode === 'play' || S.mode === 'dead' || S.mode === 'clear') { let t = dt; while (t > 1e-6) { const d = Math.min(STEP, t); update(d); t -= d; } }
  if (before) before(dt);
  animate(dt, clockT);
  applyCamera(dt, clockT);
  if (!hud.hidden) updateHud();
  renderer.render(scene, camera);
}
function frame(now) {
  requestAnimationFrame(frame);
  if (MOVIE.on) { last = now; return; }
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  clockT += dt;
  if (S.mode === 'play' || S.mode === 'dead' || S.mode === 'clear') {
    acc += dt; let n = 0;
    while (acc >= STEP && n < 5) { update(STEP); acc -= STEP; n++; }
    if (n === 5) acc = 0;
  }
  animate(dt, clockT);
  applyCamera(dt, clockT);
  if (!hud.hidden) updateHud();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
</script>
