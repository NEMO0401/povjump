/* Layout: full-bleed 3D stage, HUD strip along the top, instruction card on the left over the scene.
   Look: toy-diorama daylight, pixel Japanese type for title and numbers, rounded body face for reading. */
:root {
  --ink: #141a3a;
  --ink-2: #1f2a5c;

  --sun: #ffc93c;

  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; background: var(--sky); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

.hud, .overlay {
  position: absolute; inset: 0;

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud { pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }

.stat { display: flex; flex-direction: column; min-width: 0; }

.val { font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(20,26,58,.7), 0 0 10px rgba(20,26,58,.35); }

<script>
(function () {

const UP = new THREE.Vector3(0, 1, 0);

const matCache = {};

const GEO = {

/* ---------- textures ---------- */

/* ================= audio ================= */

    case 'stun': tone(700, 0.45, 'sawtooth', 0.05, 120); break;
    case 'wall': tone(180, 0.35, 'square', 0.05, 520); break;
    case 'bump': tone(140, 0.1, 'square', 0.05, 90); break;
    case 'break': tone(300, 0.18, 'sawtooth', 0.04, 60); break;

/* 画面の文字は、日本語の文をそのまま「鍵」にして T('…') で訳す。{n} のような部分は、あとから数字などを入れる */
/* 訳は 02_dict.js の DICT にある。訳が見つからないときは日本語のまま出す */
const LANG_LIST = [['ja', '日本語'], ['en', 'English'], ['zh', '中文'], ['es', 'Español'], ['hi', 'हिन्दी']];
const LANG_TAG = { ja: 'ja', en: 'en', zh: 'zh-CN', es: 'es', hi: 'hi' };
function langOk(l) { return !!LANG_TAG[l]; }
function detectLang() {
  try { const q = /[?&]lang=([a-z]{2})\b/.exec(location.search || ''); if (q && langOk(q[1])) return q[1]; } catch (e) {}
  try { const s = localStorage.getItem('povjump-lang'); if (s && langOk(s)) return s; } catch (e) {}
  let n = 'ja';
  try { n = String((navigator.languages && navigator.languages[0]) || navigator.language || 'ja').toLowerCase(); } catch (e) {}
  const two = n.slice(0, 2);
  if (langOk(two)) return two;
  return 'en';
}
let LANG = detectLang();
function T(key, v) {
  let s = key;
  if (LANG !== 'ja') { try { const d = DICT[LANG]; if (d && d[key]) s = d[key]; } catch (e) {} }
  if (v) s = s.replace(/\{(\w+)\}/g, function (m, k) { return v[k] !== undefined && v[k] !== null ? String(v[k]) : m; });
  return s;
}
function thName(th) { return T(th.name); }
/* 言語ごとの文字(中国語とヒンディー語は、その文字が入った書体を読みこむ) */
const LANG_FONT = {
  zh: 'https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;800&display=swap',
  hi: 'https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap'
};
const fontLoaded = {};
function loadLangFont(l) {
  if (!LANG_FONT[l] || fontLoaded[l]) return;
  fontLoaded[l] = true;
  try { const k = document.createElement('link'); k.rel = 'stylesheet'; k.href = LANG_FONT[l]; document.head.appendChild(k); } catch (e) {}
}
/* 絵(シェア画像)に文字を書くときの書体 */
function fontRound() {
  return LANG === 'zh' ? '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif' : LANG === 'hi' ? '"Baloo 2", "Noto Sans Devanagari", "Nirmala UI", sans-serif' : '"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif';
}
/* HTML に書いてある文字(data-t="鍵")を、いまの言語にする */
function applyStatic() {
  try {
    document.documentElement.lang = LANG_TAG[LANG];
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-ta]').forEach(function (el) { const p = el.getAttribute('data-ta').split('|'); el.setAttribute(p[0], T(p[1])); });
  } catch (e) {}
}
function setLang(l) {
  if (!langOk(l)) return;
  LANG = l;
  try { localStorage.setItem('povjump-lang', l); } catch (e) {}
  loadLangFont(l); applyStatic();
  if (typeof HC === 'object') ['st', 'th', 'fs', 'bf', 'bn'].forEach(function (k) { HC[k] = undefined; });
}
function langButtons() {
  return '<div class="langs" role="group" aria-label="Language">' + LANG_LIST.map(function (p) {
    return '<button class="lng' + (p[0] === LANG ? ' on' : '') + '" data-act="lang" data-l="' + p[0] + '" lang="' + LANG_TAG[p[0]] + '"' + (p[0] === LANG ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' + p[1] + '</button>';
  }).join('') + '</div>';
}
/* タイトル用: 場所をとらない言語メニュー */
function langSelect() {
  return '<label class="langsel"><span aria-hidden="true">🌐</span><select id="sLang" aria-label="Language">' + LANG_LIST.map(function (p) {
    return '<option value="' + p[0] + '"' + (p[0] === LANG ? ' selected' : '') + '>' + p[1] + '</option>';
  }).join('') + '</select></label>';
}
/* 日付を、その言語の書き方で */
function fmtDate(iso) {

}

/* ================= 3Dモデル(ChatGPTで作ったGLBを1つのファイルにまとめたもの) ================= */

const MODELS = { ready: false, failed: false, H: null, buf: null, geo: {}, world: {} };
function loadModels() {
  if (typeof fetch !== 'function') { MODELS.failed = true; return Promise.resolve(false); }

  return fetch('models.json', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error('http ' + r.status);

    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);

    const txt = new TextDecoder().decode(new Uint8Array(ab, 4, hl));

  if (tint) c = c.lerp(new THREE.Color(tint), 0.65);
  const o = { color: c };
  if (flags.indexOf('g') >= 0) o.emissive = c.clone().multiplyScalar(0.62);

  return (modelMatCache[key] = new THREE.MeshLambertMaterial(o));
}
function modelPrimGeo(name, mi, ni, pi) {
  const key = name + '/' + ni + '/' + pi;
  if (MODELS.geo[key]) return MODELS.geo[key];
  const md = MODELS.H.models[name], pr = md.nodes[ni].g[pi];
  const pos16 = new Int16Array(MODELS.buf, MODELS.base + pr.vo, pr.vn * 3);
  const idx = new Uint16Array(MODELS.buf, MODELS.base + pr.io, pr.in);
  const pos = new Float32Array(pos16.length);
  for (let k = 0; k < pos16.length; k++) pos[k] = pos16[k] * md.q;
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  g.userData.keep = true;

}

function makeModel(name, opt) {

    const o = new THREE.Group();

/* ---------- 敵の弾の種類をふやす(どんぐり・氷・ねばねば) ---------- */
function bossShot(kind, x, y, z, tx, ty, tz, speed, r) {
  const s = enemyShot(x, y, z, tx, ty, tz, speed, r, kind);
  return s;
}
function bossLob(kind, x, y, z, tx, tz, t) {
  const s = bossShot(kind, x, y, z, tx, y, tz, 1, kind === 'acorn' ? 0.26 : 0.3);
  s.vx = (tx - x) / t; s.vz = (tz - z) / t; s.vy = (P.y + 0.5 - y + 0.5 * 18 * t * t) / t; s.grav = 18; s.life = t + 1.5;
  return s;
}
function shotLook(g, kind, r) {
  if (kind === 'acorn') {
    const nut = mesh(GEO.sph, 0xb0743a, r, r * 1.2, r, 0, 0, 0), cap = mesh(GEO.sph, 0x6b4226, r * 1.08, r * 0.55, r * 1.08, 0, r * 0.7, 0), st = mesh(GEO.cyl, 0x4a2e1a, r * 0.18, r * 0.5, r * 0.18, 0, r * 1.25, 0);
    const b = new THREE.Group(); b.add(nut); b.add(cap); b.add(st); g.add(b); g.userData = { body: null, spin: b }; return true;
  }
  if (kind === 'ice') {

    const bd = new THREE.Sprite(new THREE.SpriteMaterial({ map: fxTex('ball_ice'), transparent: true, depthWrite: false })); bd.scale.set(r * 2.8, r * 2.8, 1); g.add(bd);
    g.userData = { body: bd, glow: gl }; return true;
  }
  if (kind === 'goo') {
    const b = mesh(GEO.sph, 0x8ee86a, r, r, r, 0, 0, 0, { emissive: 0x2a5a10 }); b.material.transparent = true; b.material.opacity = 0.85; g.add(b);
    g.userData = { body: null, spin: b }; return true;
  }
  return false;
}
function shotHitPlayer(s) {
  if (s.kind === 'goo') { P.sticky = 4; toast(T('ねばねば! しばらくジャンプが低くなる'), 1500); sfx('splash'); return true; }
  return false;
}
function shotGone(s) {
  if (s.kind === 'acorn') { burst(s.x, s.y, s.z, 0x8a5a34, 6, 3, 0.1, 0.35, 10); return true; }
  if (s.kind === 'goo') { burst(s.x, s.y, s.z, 0x9be03a, 7, 3, 0.12, 0.4, 8); return true; }
  if (s.kind === 'ice' || s.kind === 'wisp') { fxBoom(s.x, s.y, s.z, 'ice', 0.8); return true; }
  if (s.kind === 'rock') { burst(s.x, s.y, s.z, 0x4a3a34, 8, 4, 0.14, 0.4, 10); return true; }
  if (s.kind === 'feather') { burst(s.x, s.y, s.z, 0xfff07a, 6, 3, 0.1, 0.3); return true; }
  return false;
}

   モリノヌシ(中ボス): 突進を大木にぶつけさせ、目を回したら頭をふむ。3回で撃破

BOSS_IMPL.morinonushi = {
  name: 'モリノヌシ', intro: 'ちゅうボス モリノヌシ! 突進を大木にぶつけて、目を回したら頭をふめ!',

      else { m = new THREE.Group(); m.add(mesh(GEO.cyl, 0x8a5a34, 0.5, 3, 0.5, 0, 1.5, 0)); m.add(mesh(GEO.sph, 0x4caf50, 1.6, 1.4, 1.6, 0, 3.4, 0)); }
      m.position.set(w[0], 0, w[1]); m.rotation.y = Math.random() * 6.28; worldGroup.add(m);
      addBox(w[0] - 0.55, w[0] + 0.55, 0, 3.2, w[1] - 0.55, w[1] + 0.55, null);

  step: function (e, dt) {

      if (e.cd <= 0) {
        const r = Math.random();

        else if (r < 0.8) { e.state = 'throw'; e.pt = 0.5; e.n = 2 + (bossLoop() > 0 ? 1 : 0); }
        else { e.state = 'pound'; e.pt = 0.7; }

    } else if (e.state === 'aim') {

/* =====================================================================
   ユキダルマン(中ボス): ファイアかムチで雪玉を1段ずつとかす(アイスは回復)。

   ===================================================================== */
BOSS_IMPL.yukidaruman = {

    void sc;
    return g;
  },
  init: function (e) {
    e.snow = 3; e.maxhp = 4; e.hp = 4; e.state = 'walk'; e.cd = 1.8; e.name = 'ユキダルマン';
    e.hw = 0.95; e.h = 2.25; e.pant = 0;
    BOSS_IMPL.yukidaruman.shape(e);
  },
  shape: function (e) {
    const u = e.mesh.userData, p = u.parts, L = bossLoop();
    e.speed = [3.6, 2.8, 2.1, 1.4][e.snow] * (1 + 0.15 * L);
    e.hp = e.snow + 1;
    const hs = [0.75, 1.3, 1.85, 2.25];
    e.h = hs[e.snow]; e.hw = [0.55, 0.7, 0.85, 0.95][e.snow];
    if (!p) return;
    ownMeshes(p.body, e.snow >= 3); ownMeshes(p.torso, e.snow >= 2);
    if (p.arm_L) { p.arm_L.visible = e.snow >= 2; p.arm_R.visible = e.snow >= 2; }
    const d = u.drop || [0, 0, 0];
    u.inner.position.y = e.snow >= 3 ? 0 : e.snow === 2 ? -d[1] : -d[2];
  },
  melt: function (e, n) {

    for (let k = 0; k < 10; k++) fxEmit({ tex: 'puff', add: false, x: e.x + frr(-0.8, 0.8), y: e.y + frr(0.3, 1.6), z: e.z + frr(-0.8, 0.8), vy: frr(1, 2.4), life: frr(0.8, 1.3), s0: 0.4, s1: 1.4, a: 0.5, ramp: FXR.ice, drag: 1 });
    burst(e.x, e.y + 0.8, e.z, 0xffffff, 12, 5, 0.18, 0.6);
    BOSS_IMPL.yukidaruman.shape(e);
    if (e.state !== 'head') { e.state = 'hurt'; e.pt = 0.7; }
    if (e.snow === 0) { e.state = 'head'; e.pt = 0; toast(T('いまだ! 頭をふめ!'), 1400); }
  },
  step: function (e, dt) {
    if (!S.fightOn) { e.vx = e.vz = 0; return; }
    const Y = BOSS_IMPL.yukidaruman;
    e.inv = Math.max(0, e.inv - dt); e.hitCd = Math.max(0, e.hitCd - dt); e.flash = Math.max(0, e.flash - dt);
    const to = bossDirTo(e, P.x, P.z), dist = to[2]; e.dx = to[0]; e.dz = to[1];
    e.pt -= dt;
    if (e.state === 'walk') {

      e.vx = e.vz = 0; const m = Y.mouth(e); fxCharge(e, m[0], m[1], m[2], 'ice', 0.9, dt);

      if (e.pt <= 0) { e.state = 'walk'; e.cd = 1.4 + Math.random(); }
    } else if (e.state === 'roll') {
      e.vx = e.vz = 0;
      if (e.pt <= 0) {

    BOSS_IMPL.yukidaruman.melt(e, n);

    if (p.head) p.head.rotation.x = st === 'wind' ? -0.35 : st === 'breath' ? 0.15 : st === 'pant' ? Math.sin(t * 9) * 0.12 : 0;

/* =====================================================================
   ゼリーキング(ボス): あてるたびに2つに分裂(大→中→小)。小さいのを全部たおすと撃破。
   本体(e)は最初の1発のあと見えない「親」になり、HPゲージだけを持つ
   ===================================================================== */
const JELLY_SC = [1.4, 0.82, 0.5];

          if (Math.hypot(P.x - c.x, P.z - c.z) < 1.3 + P.hw) hurt();
          if (e.armor && Math.hypot(e.x - c.x, e.z - c.z) < 2.1) { Y.setArmor(e, false); e.state = 'helm'; e.pt = 4.5; sfx('break'); burst(e.x, 1.2, e.z, 0x8a8fa3, 18, 6, 0.2, 0.8); toast(T('鎧がくずれた! 兜をふめ!'), 1500); }
        }

    });
    const to = bossDirTo(e, P.x, P.z), dist = to[2];

        if (S.mode === 'play' && P.onGround && Math.hypot(P.x - e.x, P.z - e.z) <= R) { if (Math.hypot(P.x - e.x - e.dx * 1.2, P.z - e.z - e.dz * 1.2) < 1.3) bossHurtPlayer(e, 9); else stunPlayer(); }
        /* 衝撃で真上のシャンデリアが落ちる */
        (e.chands || []).forEach(function (c) { if (Math.hypot(c.x - e.x, c.z - e.z) < 2.2) Y.dropChand(c); });
        e.state = 'rest'; e.pt = 1.0;

    } else if (e.state === 'wisp') {

        if (e.n > 0) { const h = partWorld(e.mesh.userData.parts && e.mesh.userData.parts.head); bossShot('wisp', e.x + e.dx * 0.6, Math.max(1.2, h.y), e.z + e.dz * 0.6, P.x, P.y + P.h * 0.5, P.z, 7.5, 0.28); e.n--; e.pt = 0.4; }

    if (p.arm_L) p.arm_L.rotation.x = walking ? -Math.sin(t * 7) * 0.3 : 0;
    if (p.head) p.head.position.y = (p.head.userData.y0 === undefined ? (p.head.userData.y0 = p.head.position.y) : p.head.userData.y0) + Math.sin(t * 3) * 0.06;
  }

/* =====================================================================
   ドクガエルおう(中ボス): 王冠が弱点だが高くて届かない。吐いてくる毒の泡をふむと高くはねるので、

   ===================================================================== */

  name: 'ドクガエルおう', intro: 'ちゅうボス ドクガエルおう! 毒の泡をふんで高くはね、王冠をふめ!',
  make: function () { if (!hasModel('dokugaeru')) return mkDragon(false); const g = wrapModel('dokugaeru', 1.8); g.userData.parts = g.userData.p; return g; },
  init: function (e) { const L = bossLoop(); e.hw = 1.0; e.h = 2.35; e.maxhp = e.hp = 3 + L; e.state = 'idle'; e.pt = 1.2; e.bubs = []; e.name = 'ドクガエルおう'; },
  newBub: function (e, x, z, vx, vz) {

    if (P.onGround) P.bubbleBoost = false;
    e.bubs.forEach(function (b) {

      if (S.mode === 'play' && dxz < 0.6 + P.hw && P.y < b.y + 0.75 && P.y + P.h > b.y - 0.6) {

    });

/* =====================================================================

try { setTouch(!!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)); } catch (e) {}
applyStatic();
loadRun();
boot();
loadModels().then(function () { if (S.mode === 'title') boot(); });

let last = performance.now(), acc = 0;
/* 撮影モード: 動画用に1コマずつ決まった時間だけ進めて描く(普段は使わない) */
const MOVIE = { on: false };
function movieStep(dt, before) {
  clockT += dt;
  if (S.mode === 'play' || S.mode === 'dead' || S.mode === 'clear') { let t = dt; while (t > 1e-6) { const d = Math.min(STEP, t); update(d); t -= d; } }
  if (before) before(dt);
  animate(dt, clockT);
  applyCamera(dt, clockT); skyFollow();
  if (!hud.hidden) updateHud();
  renderer.render(scene, camera);
}
function frame(now) {
  requestAnimationFrame(frame);
  if (MOVIE.on) { last = now; return; }
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  clockT += dt;
  if (S.mode === 'play' || S.mode === 'dead' || S.mode === 'clear') {
    acc += dt; let n = 0;
    while (acc >= STEP && n < 5) { update(STEP); acc -= STEP; n++; }
    if (n === 5) acc = 0;
  }
  animate(dt, clockT);
  applyCamera(dt, clockT); skyFollow();
  if (!hud.hidden) updateHud();
  renderer.render(scene, camera);
  recCapture(now);
}
requestAnimationFrame(frame);
})();
</script>
