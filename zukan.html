<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#0f1630;color:#eef1ff;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans SC","Noto Sans Devanagari",sans-serif;line-height:1.7}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:clamp(22px,5vw,32px);color:#ffc93c;letter-spacing:.02em}
.lead{margin:8px 0 18px;color:#c9d0f2}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=search]{background:#1b2548;color:#eef1ff;border:2px solid #36427a;border-radius:10px;padding:8px 10px;font-size:15px}
.btn{display:inline-block;background:#ffc93c;color:#2a2000;font-weight:700;text-decoration:none;padding:9px 16px;border-radius:12px;box-shadow:0 3px 0 #b88a00}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:#1b2548;border:2px solid #36427a;color:#eef1ff;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.tab[aria-pressed=true]{background:#ffc93c;border-color:#ffc93c;color:#2a2000;font-weight:700}
.count{color:#9aa6d8;font-size:13px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:#18214a;border:2px solid #2d3a74;border-radius:16px;padding:14px 16px}
.card.mini{border-color:#e08a2c}
.card.boss{border-color:#e0463c;background:#241a3c}
.head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.badge{flex:none;width:42px;height:42px;border-radius:12px;background:#2d3a74;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#ffc93c}
.card.mini .badge{background:#5a3a17}
.card.boss .badge{background:#5a1f26}
.name{margin:0;font-size:19px;line-height:1.3}
.tier{font-size:12px;color:#9aa6d8}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}
.tag{font-size:11px;background:#2d3a74;border-radius:999px;padding:1px 8px;color:#cdd5ff}
.sec{margin:8px 0 0}
.sec b{display:block;font-size:12px;color:#ffc93c;letter-spacing:.04em}
.sec p{margin:1px 0 0;font-size:14.5px}
.none{text-align:center;color:#9aa6d8;padding:40px 0}
footer{margin-top:28px;color:#8b97cc;font-size:13px;text-align:center}
@media(max-width:480px){.count{width:100%;margin-left:0}}
</style>
</head>

(function () {
  var DATA = [{"id": "kodora", "cat": "mini", "th": ["all"], "t": {"ja": ["コドラ", "ちいさなドラゴン。5ステージごとの最終面に出てくる、中ボスです(ステージによって別の中ボスのことも)。", "ブレス(火の玉)を連続ではいてきます。ステージが進むと、いちどに吐く数がふえます。", "頭の上から踏んでダメージを与えます。ファイアなどのパワーでもOKです。"], "en": ["Kodora", "A small dragon. A mini-boss waiting at the end of every five stages (sometimes another mini-boss takes its place).", "Breathes fireballs in volleys. The volley gets bigger as the stages go on.", "Stomp its head to damage it. Fire and other powers work too."], "zh": ["小德拉", "小龙。每5关的最后一关会出现的中头目（有时会换成别的中头目）。", "连续喷出火球。关卡越往后，一次喷出的数量越多。", "踩它的头造成伤害。火焰等能力也行。"], "es": ["Kodora", "Un dragón pequeño. Minijefe al final de cada cinco niveles (a veces lo sustituye otro minijefe).", "Escupe bolas de fuego en ráfagas. Las ráfagas crecen según avanzan los niveles.", "Písale la cabeza para dañarlo. El Fuego y otros poderes también sirven."], "hi": ["कोडोरा", "छोटा ड्रैगन। हर पाँच स्तर के आख़िरी स्तर पर आने वाला मिनी-बॉस (कभी-कभी उसकी जगह कोई दूसरा मिनी-बॉस आता है)।", "आग के गोले एक साथ कई-कई दागता है। स्तर बढ़ने पर एक बार में दागे जाने वाले गोले बढ़ते जाते हैं।", "उसके सिर पर कूदकर चोट पहुँचाओ। आग जैसी शक्तियाँ भी चलती हैं।"]}}, {"id": "morinonushi", "cat": "mini", "th": ["forest"], "t": {"ja": ["モリノヌシ", "苔むした大きな切り株の精。もりの中ボスです。", "どんぐりを山なりに投げます。腕で地面をたたいて衝撃波を出し、突進もしてきます。", "突進を、アリーナにある大木にぶつけさせます。目を回したら頭を踏みます(3回)。"], "en": ["Forest Warden", "A giant mossy tree-stump spirit. The Forest mini-boss.", "Lobs acorns in an arc, slams its arms for shockwaves and also charges at you.", "Make its charge hit the big tree in the arena. When it gets dizzy, stomp its head (three times)."], "zh": ["森之主", "长满青苔的大树桩精灵。森林关卡的中头目。", "抛出弧线橡果，用手臂砸地产生冲击波，还会冲撞过来。", "引它冲撞场地里的大树。它头晕时踩它的头（3次）。"], "es": ["Guardián del bosque", "Un enorme espíritu de tocón cubierto de musgo. El minijefe del Bosque.", "Lanza bellotas en arco, golpea el suelo con los brazos para crear ondas y también embiste.", "Haz que su embestida choque contra el gran árbol de la arena. Cuando se maree, písale la cabeza (tres veces)."], "hi": ["जंगल का रक्षक", "काई से ढके विशाल ठूँठ की आत्मा। जंगल का मिनी-बॉस।", "बलूत के फल चाप में फेंकता है, हाथों से ज़मीन पीटकर झटके की लहर बनाता है और टक्कर मारने भी दौड़ता है।", "उसकी टक्कर को अखाड़े के बड़े पेड़ से भिड़वाओ। चक्कर खाए तो उसके सिर पर कूदो (तीन बार)।"]}}, {"id": "yukidaruman", "cat": "mini", "th": ["ice"], "t": {"ja": ["ユキダルマン", "にんじんの鼻とバケツの帽子の、大きな雪だるま。こおりの中ボスです。", "雪玉を転がして飛ばします。こおりのブレスもはきます。", "ブレスで息切れしたときに頭を踏むと、雪が1だんへります。最後は頭を踏んで倒します。ファイア・ムチでもとけます(アイスは逆に回復します)。"], "en": ["Snowman King", "A big snowman with a carrot nose and a bucket hat. The Ice mini-boss.", "Rolls snowballs at you and breathes icy air.", "Stomp its head when it is out of breath after its breath attack to remove one layer of snow. Finish it with a final head stomp. Fire and Whip melt it too (Ice heals it instead)."], "zh": ["雪人王", "有着胡萝卜鼻子和水桶帽的大雪人。冰原关卡的中头目。", "滚出雪球砸向你，还会喷出冰冷的吐息。", "它喷息后喘气时踩它的头，就能去掉一层雪。最后再踩一次头打倒它。火焰和鞭子也能融化它（冰冻反而会让它回复）。"], "es": ["Rey Muñeco de Nieve", "Un gran muñeco de nieve con nariz de zanahoria y sombrero de cubo. El minijefe del Hielo.", "Hace rodar bolas de nieve contra ti y sopla aire helado.", "Písale la cabeza cuando esté sin aliento tras su soplido para quitarle una capa de nieve. Remátalo con un último pisotón. El Fuego y el Látigo también lo derriten (el Hielo, en cambio, lo cura)."], "hi": ["बर्फ़ का राजा", "गाजर की नाक और बाल्टी वाली टोपी पहने बड़ा स्नोमैन। बर्फ़ का मिनी-बॉस।", "बर्फ़ के गोले लुढ़काकर फेंकता है और बर्फ़ीली साँस छोड़ता है।", "साँस छोड़ने के बाद जब वह हाँफे तब उसके सिर पर कूदो, बर्फ़ की एक परत हट जाएगी। आख़िर में सिर पर कूदकर हराओ। आग और चाबुक से भी पिघलता है (बर्फ़ से उलटा ठीक हो जाता है)।"]}}, {"id": "yoroinaito", "cat": "mini", "th": ["manor"], "t": {"ja": ["よろいナイト", "やしきにある、からっぽの大きな鎧。兜の中に青白い火がともっています。やしきの中ボスです。", "剣をふりおろして衝撃波を出します。青白い火の玉も飛ばします。", "剣をふりおろすと、天井のシャンデリアが落ちてきます。ナイトの上に落として鎧をくずし、兜を踏みます(3回)。"], "en": ["Armor Knight", "An empty suit of giant armor in the mansion with a pale blue flame inside the クガエルおう", "小さな王冠をのせた、紫と黄緑のどくガエル。どくのぬまの中ボスです。", "大ジャンプして、着地で毒の衝撃波を出します。毒玉も連続ではきます。", "毒の泡を踏んで高くはね、頭の王冠を踏みます。"], "en": ["Poison Frog King", "A purple and lime-green poison frog with a small crown. The Poison Swamp mini-boss.", "Leaps high and sends a poison shockwave when it lands. It also spits poison balls in a row.", "Bounce high off the poison bubbles, then stomp the crown on its head."], "zh": ["毒蛙王", "戴着小王冠的紫色和黄绿色毒蛙。毒沼关卡的中头目。", "高高跳起，落地时产生毒冲击波。还会连续吐出毒球。", "踩毒泡弹得更高，再踩它头上的王冠。"], "es": ["Rey Rana venenosa", "Una rana venenosa morada y verde lima con una pequeña corona. El minijefe del Pantano tóxico.", "Salta alto y al caer lanza una onda venenosa. También escupe bolas de veneno seguidas.", "Rebota alto en las burbujas venenosas y pisa la corona de su cabeza."], "hi": ["ज़हरीला मेंढक राजा", "छोटा मुकुट पहने बैंगनी और हरे रंग का ज़हरीला मेंढक। ज़हरीले दलदल का मिनी-बॉस।", "ऊँचा कूदकर उतरते समय ज़हरीली झटका-लहर बनाता है। ज़हर के गोले भी लगातार थूकता है।", "ज़हर के बुलबुलों पर कूदकर ऊँचा उछलो और उसके सिर के मुकुट पर कूदो।"]}}, {"id": "dorago", "cat": "boss", "th": ["all"], "t": {"ja": ["ドラゴ大王", "大きなドラゴンの王さま。ボスです。", "大きくジャンプして着地すると、まわりに衝撃波が広がります(範囲は10ステージごとに広がります)。ブレスもはきます。", "着地やブレスのあとに、ふらふらになります。そのときに頭を踏みましょう。ファイア・アイス・ムチ・サンダーでも少しずつ倒せます。"], "en": ["Dorago the Great", "The great dragon king. A boss.", "Jumps high and sends a shockwave all around when it lands (the range grows every 10 stages). It also breathes fire.", "It gets dizzy after landing and after its breath. That is your chance to stomp its head. Fire, Ice, Whip and Thunder also wear it down."], "zh": ["德拉戈大王", "巨大的龙王。首领。", "高高跳起，落地时向四周扩散冲击波（范围每10关变大）。也会喷火。", "落地和喷火之后它会头晕。这时就踩它的头。火焰、冰冻、鞭子和雷电也能一点点打倒它。"], "es": ["Rey Drago", "El gran rey dragón. Un jefe.", "Salta alto y al caer lanza una onda expansiva (el alcance crece cada 10 niveles). También escupe fuego.", "Tras caer o escupir fuego se marea. Entonces písale la cabeza. Fuego, Hielo, Látigo y Rayo también lo desgastan."], "hi": ["ड्रैगन राजा ड्रेगो", "विशाल ड्रैगन का राजा। बॉस।", "ऊँचा कूदकर उतरता है तो चारों ओर झटके की लहर फैलती है (दायरा हर 10 स्तर पर बढ़ता है)। आग भी उगलता है।", "उतरने और आग उगलने के बाद चक्कर खा जाता है। तभी उसके सिर पर कूदो। आग, बर्फ़, चाबुक और बिजली से भी धीरे-धीरे हारता है।"]}}, {"id": "jelly_king", "cat": "boss", "th": ["sea", "poison"], "t": {"ja": ["ゼリーキング", "王冠をのせた、巨大なゼリー状のスライム。うみ・どくのぬまのボスです(2周目以降)。", "体当たりと、ねばねばの弾です。", "ダメージを受けるたびに、小さなスライム2匹に分裂します。小さくなるまで、ぜんぶ踏みます(合計5回)。"], "en": ["Jelly King", "A giant jelly slime wearing a crown. A boss in the Sea and Poison Swamp (from the second round on).", "Body slams and sticky shots.", "Every time it takes damage it splits into two smaller slimes. Keep stomping until every piece is gone (five stomps in total)."], "zh": ["果冻王", "戴着王冠的巨大果冻史莱姆。海洋和毒沼关卡的首领（第二轮以后）。", "撞击和黏糊糊的弹。", "每受到一次伤害就会分裂成两只小史莱姆。把所有碎块都踩掉（共5次）。"], "es": ["Rey Gelatina", "Un limo gigante de gelatina con corona. Jefe del Mar y del Pantano tóxico (a partir de la segunda vuelta).", "Embestidas y disparos pegajosos.", "Cada vez que recibe daño se divide en dos limos más pequeños. Sigue pisando hasta que no quede ninguno (cinco pisotones en total)."], "hi": ["जेली राजा", "मुकुट पहने विशाल जेली स्लाइम। समुद्र और ज़हरीले दलदल का बॉस (दूसरे दौर से)।", "टक्कर और चिपचिपे गोले।", "हर बार चोट लगने पर वह दो छोटे स्लाइम में बँट जाता है। सारे टुकड़े ख़त्म होने तक कुचलते रहो (कुल पाँच बार)।"]}}, {"id": "daiodako", "cat": "boss", "th": ["sea"], "t": {"ja": ["ダイオウダコ", "巨大な赤いタコ。丸い頭に怒った目と、6本の触手があります。うみのボスです。", "すみを連射します。触手で地面をたたいて衝撃波を出します。", "触手のたたきつけのあとに頭を踏むと、触手が切れます。6本切ったら、落ちてきた頭を踏みます。"], "en": ["Giant Octopus", "A huge red octopus with a round head, angry eyes and six tentacles. The Sea boss.", "Fires ink in rapid succession and slams its tentacles for shockwaves.", "Stomp its head right after a tentacle slam to cut that tentacle off. After all six are cut, stomp the head when it drops."], "zh": ["大王章鱼", "巨大的红色章鱼，圆圆的头上有愤怒的眼睛和6条触手。海洋关卡的首领。", "连续喷射墨汁，用触手拍地产生冲击波。", "触手拍地之后踩它的头，就能砍断那条触手。6条全断后，踩掉下来的头。"], "es": ["Pulpo gigante", "Un enorme pulpo rojo de cabeza redonda, ojos furiosos y seis tentáculos. El jefe del Mar.", "Dispara tinta sin parar y golpea el suelo con los tentáculos para crear ondas.", "Písale la cabeza justo después de que golpee con un tentáculo para cortarlo. Cuando cortes los seis, pisa la cabeza cuando caiga."], "hi": ["विशाल ऑक्टोपस", "गोल सिर, गुस्से वाली आँखों और छह भुजाओं वाला विशाल लाल ऑक्टोपस। समुद्र का बॉस।", "लगातार स्याही दागता है और भुजाओं से ज़मीन पीटकर झटके की लहर बनाता है।", "भुजा के पटकने के ठीक बाद उसके सिर पर कूदो तो वह भुजा कट जाती है। छहों कट जाएँ तो गिरे हुए सिर पर कूदो।"]}}, {"id": "magmagolem", "cat": "boss", "th": ["lava", "cave"], "t": {"ja": ["マグマゴーレム", "黒い岩の巨人。われ目からマグマが光り、胸に核があります。マグマ・どうくつのボスです。", "岩を投げます。地面をたたいて、ひろがるマグマの輪を出します。", "柱の上にさそい出して、スイッチを踏み、打ち上げます。"], "en": ["Magma Golem", "A giant of black rock with glowing magma in its cracks and a core in its chest. A boss in Magma and Cave stages.", "Throws rocks and slams the ground to send out an expanding ring of magma.", "Lure it onto a pillar and step on the switch to launch it into the air."], "zh": ["岩浆魔像", "黑色岩石的巨人，裂缝中透出岩浆的光，胸口有核心。岩浆和洞窟关卡的首领。", "投掷岩石，拍打地面产生不断扩大的岩浆圈。", "把它引到石柱上，再踩开关把它弹飞。"], "es": ["Gólem de magma", "Un gigante de roca negra con magma brillando en las grietas y un núcleo en el pecho. Jefe de los niveles de Magma y Cueva.", "Lanza rocas y golpea el suelo para crear un anillo de magma que se expande.", "Atráelo sobre un pilar y pisa el interruptor para lanzarlo por los aires."], "hi": ["लावा गोलेम", "काली चट्टान का विशाल दैत्य, जिसकी दरारों में लावा चमकता है और छाती में कोर है। लावा और गुफ़ा का बॉस।", "चट्टानें फेंकता है और ज़मीन पीटकर फैलता हुआ लावा का घेरा बनाता है।", "उसे खंभे के ऊपर बुलाओ और स्विच पर कूदकर हवा में उछाल दो।"]}}, {"id": "thunderbird", "cat": "boss", "th": ["sky"], "t": {"ja": ["サンダーバード", "黄色と白の大きな鳥。頭に雷のとさかがあります。そらのボスです。", "羽ばたきで弾を飛ばします。予告のマークが出たあと、落雷が起きます。", "避雷針のそばで、雷をさそいます。落ちてきたら踏みます。"], "en": ["Thunderbird", "A big yellow-and-white bird with a lightning crest. The Sky boss.", "Sends shots flying with its wing beats and calls down lightning after a warning mark appears.", "Stand near a lightning rod to lure the lightning. When the bird falls, stomp it."], "zh": ["雷鸟", "黄白相间的大鸟，头上有雷电形状的冠羽。天空关卡的首领。", "扇动翅膀射出弹，出现预告标记后会落雷。", "站在避雷针旁边引雷。它掉下来后踩它。"], "es": ["Pájaro del trueno", "Un gran pájaro amarillo y blanco con una cresta de rayo. El jefe del Cielo.", "Lanza proyectiles con el aleteo y, tras una marca de aviso, hace caer rayos.", "Colócate junto a un pararrayos para atraer el rayo. Cuando el pájaro caiga, písalo."], "hi": ["बिजली पक्षी", "पीले और सफ़ेद रंग का बड़ा पक्षी, जिसके सिर पर बिजली जैसी कलगी है। आकाश का बॉस।", "पंख फड़फड़ाकर गोले दागता है और चेतावनी का निशान दिखने के बाद बिजली गिराता है।", "तड़ित चालक के पास खड़े होकर बिजली को बुलाओ। पक्षी गिरे तो उस पर कूदो।"]}}, {"id": "cosmoeye", "cat": "boss", "th": ["space"], "t": {"ja": ["コスモアイ", "宙にうかぶ、巨大な目玉。まわりを金属のリングがまわっています。うちゅうのボスです。", "レーザーを撃ちます。隕石を降らせます。ワープして位置を変えます。", "出てくるスーパーファイアフラワーを取って、瞳を撃ちます。"], "en": ["Cosmo Eye", "A giant eyeball floating in space, ringed by spinning metal rings. The Space boss.", "Fires lasers, rains down meteors and warps to change position.", "Grab the Super Fire Flower that appears and shoot its pupil."], "zh": ["宇宙之眼", "漂浮在宇宙中的巨大眼球，周围有金属环在旋转。宇宙关卡的首领。", "发射激光、降下陨石，还会瞬移改变位置。", "拿到出现的超级火焰花，射击它的瞳孔。"], "es": ["Ojo cósmico", "Un ojo gigante que flota en el espacio, rodeado de anillos metálicos giratorios. El jefe del Espacio.", "Dispara láseres, hace caer meteoritos y se teletransporta para cambiar de posición.", "Recoge la Superflor de fuego que aparece y dispárale a la pupila."], "hi": ["कॉस्मो आई", "अंतरिक्ष में तैरती विशाल आँख, जिसके चारों ओर घूमते धातु के छल्ले हैं। अंतरिक्ष का बॉस।", "लेज़र चलाता है, उल्काएँ बरसाता है और जगह बदलने के लिए वार्प करता है।", "दिखने वाला सुपर फायर फ़्लावर उठाओ और उसकी पुतली पर निशाना लगाओ।"]}}, {"id": "maou", "cat": "boss", "th": ["all"], "t": {"ja": ["ドラゴ大魔王", "ドラゴ大王の「本当の姿」。黒と深紅の巨大なドラゴンで、胸に赤く光る核があります。100ステージごとに現れる、超強敵です。", "炎とジャンプ、翼を広げて空から火の雨、核をむき出しにして全方位の弾と突進、と3段階で攻めてきます。", "1:柱の上にさそってスイッチを踏む。 2:青い炎は物かげでふせぎ、へたりこんだら踏む。 3:スーパーファイアで核を撃つ。"], "en": ["Dorago the Demon King", "The \"true form\" of Dorago the Great: a giant black-and-crimson dragon with a glowing red core in its chest. A super-boss who appears every 100 stages.", "Attacks in three phases: fire and jumps; spreading its wings to rain fire from the sky; and exposing its core to fire in every direction and charge.", "1: Lure it onto a pillar and step on the switch. 2: Block the blue flames behind cover and stomp it when it collapses. 3: Shoot the core with Super Fire."], "zh": ["德拉戈大魔王", "德拉戈大王的“真身”。黑色与深红色的巨龙，胸口有发红光的核心。每100关出现的超强敌人。", "分三个阶段进攻：火焰与跳跃；展开翅膀从空中降下火雨；露出核心向四面八方射弹并冲撞。", "1：把它引到石柱上踩开关。2：躲在掩体后挡住蓝色火焰，它瘫倒时踩它。3：用超级火焰射击核心。"], "es": ["Rey Demonio Drago", "La \"verdadera forma\" del Rey Drago: un dragón gigante negro y carmesí con un núcleo rojo brillante en el pecho. Un superjefe que aparece cada 100 niveles.", "Ataca en tres fases: fuego y saltos; abre las alas y hace llover fuego; y deja el núcleo al descubierto para disparar en todas direcciones y embestir.", "1: Atráelo sobre un pilar y pisa el interruptor. 2: Bloquea las llamas azules tras un refugio y písalo cuando se desplome. 3: Dispara al núcleo con Superfuego."], "hi": ["दानव राजा ड्रेगो", "ड्रेगो महान का \"असली रूप\": काला और गहरा लाल विशाल ड्रैगन, जिसकी छाती में लाल चमकता कोर है। हर 100 स्तर पर आने वाला सुपर-बॉस।", "तीन चरणों में हमला करता है: आग और कूद; पंख फैलाकर आसमान से आग की बारिश; और कोर खोलकर चारों ओर गोले दागना तथा टक्कर मारना।", "1: उसे खंभे पर बुलाकर स्विच दबाओ। 2: नीली लपटों को ओट के पीछे रोको और वह लड़खड़ाकर बैठे तो कूदो। 3: सुपर फायर से कोर पर निशाना लगाओ।"]}}, {"id": "purl", "cat": "enemy", "th": ["all"], "t": {"ja": ["プルン", "ぷるぷるした、いちばん基本の敵。ゆっくり近づいてきます。", "体当たりだけ。", "上から踏むとつぶれます。ファイア・アイス・ムチ・サンダーでも倒せます。"], "en": ["Purun", "The most basic enemy, a wobbly blob that drifts toward you.", "Only bumps into you.", "Stomp it from above. Fire, Ice, Whip and Thunder work too."], "zh": ["噗噜", "最基础的敌人，软乎乎地慢慢靠近你。", "只会撞过来。", "从上面踩扁它。火焰、冰冻、鞭子和雷电也能打倒。"], "es": ["Purun", "El enemigo más básico: una gelatina temblorosa que se acerca poco a poco.", "Solo te embiste.", "Písalo desde arriba. También sirven Fuego, Hielo, Látigo y Rayo."], "hi": ["पुरुन", "सबसे आसान दुश्मन, थिरकता हुआ गोला जो धीरे-धीरे तुम्हारी ओर आता है।", "बस टकराता है।", "ऊपर से कूदकर कुचलो। आग, बर्फ़, चाबुक और बिजली से भी हारता है।"]}}, {"id": "gdango", "cat": "enemy", "th": ["all"], "t": {"ja": ["みどりダンゴ", "まっすぐ歩く、緑のダンゴ。", "体当たり。", "踏むと甲羅になって止まります。もう一度さわると、けり出されて、ぶつかった敵を倒します(7秒でもとに戻ります)。パワーでも倒せます。"], "en": ["Green Dango", "A green dumpling that walks straight ahead.", "Bumps into you.", "Stomp it to turn it into a shell. Touch the shell to kick it, and it knocks out enemies it hits (it recovers after 7 seconds). Powers work too."], "zh": ["绿团子", "笔直向前走的绿色团子。", "撞过来。", "踩一下会缩进壳里。再碰它会把壳踢出去，撞倒路上的敌人（7秒后恢复原样）。能力也能打倒。"], "es": ["Dango verde", "Una bolita verde que camina en línea recta.", "Te embiste.", "Písalo para que se meta en su caparazón. Tócalo para patearlo y derribará a los enemigos que golpee (se recupera a los 7 segundos). Los poderes también funcionan."], "hi": ["हरा डांगो", "सीधा चलने वाला हरा गोला।", "टकराता है।", "कूदकर कुचलो तो खोल में छिप जाता है। खोल को छूकर लात मारो तो वह टकराने वाले दुश्मनों को गिरा देता है (7 सेकंड बाद वापस ठीक हो जाता है)। शक्तियों से भी हारता है।"]}}, {"id": "rdango", "cat": "enemy", "th": ["all"], "t": {"ja": ["あかダンゴ", "赤いダンゴ。足場の端まで来ると、落ちずに引き返します。", "体当たり。", "みどりダンゴと同じです。踏んで甲羅にして、けり出しましょう。パワーでも倒せます。"], "en": ["Red Dango", "A red dumpling that turns around at the edge of a platform instead of falling.", "Bumps into you.", "Same as the Green Dango: stomp it into a shell and kick it away. Powers work too."], "zh": ["红团子", "红色团子，走到平台边缘会掉头，不会掉下去。", "撞过来。", "和绿团子一样：踩成壳再踢出去。能力也能打倒。"], "es": ["Dango rojo", "Una bolita roja que da media vuelta al llegar al borde en vez de caer.", "Te embiste.", "Igual que el Dango verde: písalo para dejarlo en caparazón y patéalo. Los poderes también funcionan."], "hi": ["लाल डांगो", "लाल गोला जो प्लेटफ़ॉर्म के किनारे पर गिरता नहीं, मुड़ जाता है।", "टकराता है।", "हरे डांगो की तरह: कूदकर खोल बनाओ और लात मारो। शक्तियों से भी हारता है।"]}}, {"id": "pata", "cat": "enemy", "th": ["forest", "sea", "sky", "space", "city", "desert"], "t": {"ja": ["パタダンゴ", "羽のはえたダンゴ。ぴょんぴょん跳ねながら近づいてきます。", "跳ねながらの体当たり。", "踏むと羽が取れて、ふつうのみどりダンゴになります。もう一度踏みましょう。パワーでも倒せます。"], "en": ["Winged Dango", "A dumpling with wings that hops toward you.", "Hopping body slams.", "Stomp it to knock off its wings and turn it into a Green Dango, then stomp again. Powers work too."], "zh": ["飞翼团子", "长着翅膀的团子，一蹦一蹦地靠近。", "边跳边撞过来。", "踩一下翅膀会掉落，变成普通的绿团子，再踩一次。能力也能打倒。"], "es": ["Dango alado", "Una bolita con alas que se acerca dando saltitos.", "Embestidas mientras salta.", "Písalo para que pierda las alas y se vuelva un Dango verde; luego písalo otra vez. Los poderes también funcionan."], "hi": ["पंखों वाला डांगो", "पंखों वाला गोला जो उछलते हुए पास आता है।", "उछलते-उछलते टकराता है।", "कूदकर कुचलो तो पंख गिर जाते हैं और वह हरा डांगो बन जाता है, फिर दोबारा कुचलो। शक्तियों से भी हारता है।"]}}, {"id": "toge", "cat": "enemy", "th": ["all"], "t": {"ja": ["トゲマル", "とげとげのダンゴ。プレイヤーのほうへ追いかけてきます。", "体当たり。とげがあるので、踏むとダメージを受けます。", "踏めません。ファイア・アイス・ムチ・サンダーで倒しましょう。"], "en": ["Spiky", "A spiky dumpling that chases you.", "Bumps into you. Stomping it hurts because of the spikes.", "It cannot be stomped. Beat it with Fire, Ice, Whip or Thunder."], "zh": ["刺球", "长满尖刺的团子，会追着你跑。", "撞过来。因为有刺，踩它会受伤。", "不能踩。用火焰、冰冻、鞭子或雷电打倒。"], "es": ["Pinchudo", "Una bolita con pinchos que te persigue.", "Te embiste. Pisarlo duele por los pinchos.", "No se puede pisar. Derrótalo con Fuego, Hielo, Látigo o Rayo."], "hi": ["कांटेदार", "काँटों वाला गोला जो तुम्हारा पीछा करता है।", "टकराता है। काँटों की वजह से कूदकर कुचलने पर चोट लगती है।", "कुचल नहीं सकते। आग, बर्फ़, चाबुक या बिजली से हराओ।"]}}, {"id": "gabu", "cat": "enemy", "th": ["all"], "t": {"ja": ["ガブ", "土管の中にひそんで、顔を出すとかみついてきます。", "土管から顔を出して、かみつきます。", "踏めません。顔を出している間にパワーで倒します。土管のすぐそばにいると、顔を出してきません。"], "en": ["Gabu", "Lurks inside a pipe and snaps at you when it pops out.", "Pops out of the pipe to bite.", "It cannot be stomped. Hit it with a power while it is out. It will not come out if you stand right next to the pipe."], "zh": ["咬咬", "藏在水管里，探出头来就会咬人。", "从水管里探出头咬人。", "不能踩。趁它探出头时用能力打倒。如果紧挨着水管站着，它就不会出来。"], "es": ["Gabu", "Se esconde en una tubería y muerde cuando asoma la cabeza.", "Sale de la tubería para morder.", "No se puede pisar. Golpéalo con un poder mientras está fuera. Si te quedas pegado a la tubería, no sale."], "hi": ["गाबू", "पाइप में छिपा रहता है और सिर निकालते ही काट लेता है।", "पाइप से सिर निकालकर काटता है।", "कुचल नहीं सकते। जब वह बाहर हो तब शक्ति से हराओ। पाइप के बिलकुल पास खड़े रहो तो वह बाहर नहीं आता।"]}}, {"id": "fplant", "cat": "enemy", "th": ["all"], "t": {"ja": ["ファイアプラント", "火の玉をはき出す、赤い花の怪物。", "火の玉を、1.5秒前にプレイヤーがいた場所へ向けて飛ばします。", "踏めません。火の玉は、立ち止まらずに動き続けるとよけられます。パワーで倒せます。近づきすぎると撃ってきません。"], "en": ["Fire Plant", "A red flower monster that spits fireballs.", "Shoots a fireball at the spot where you were 1.5 seconds ago.", "It cannot be stomped. Keep moving and the fireball will miss. Powers beat it. It will not shoot if you get too close."], "zh": ["火焰花", "会吐火球的红色花怪。", "朝你1.5秒前所在的位置发射火球。", "不能踩。一直移动就能躲开火球。能力可以打倒它。靠得太近它就不会开火。"], "es": ["Planta de fuego", "Un monstruo flor roja que escupe bolas de fuego.", "Dispara a donde estabas hace 1,5 segundos.", "No se puede pisar. Si sigues moviéndote, la bola falla. Los poderes la derrotan. Si te acercas demasiado, no dispara."], "hi": ["आग का फूल", "लाल फूल वाला राक्षस जो आग के गोले थूकता है।", "तुम 1.5 सेकंड पहले जहाँ थे, उसी जगह की ओर आग का गोला दागता है।", "कुचल नहीं सकते। चलते रहोगे तो गोला चूक जाएगा। शक्तियों से हारता है। बहुत पास जाने पर वह गोला नहीं दागता।"]}}, {"id": "cloud", "cat": "enemy", "th": ["all"], "t": {"ja": ["トゲくも", "雲に乗って、プレイヤーの少し先を並んで進み、トゲマルのたまごを投げてきます。", "トゲマルを1.5秒前の位置へ投げます。着地して3秒間は追いかけてきません。", "雲は踏めます。パワーでも倒せます。投げられたトゲマルは、ふつうに倒しましょう。"], "en": ["Spike Cloud", "Rides a cloud a little ahead of you and throws Spiky eggs.", "Throws a Spiky at where you were 1.5 seconds ago. It does not chase you for 3 seconds after landing.", "You can stomp the cloud. Powers work too. Deal with the thrown Spiky like usual."], "zh": ["刺球云", "乘着云在你前方不远处同行，向你扔刺球蛋。", "向你1.5秒前的位置扔出刺球。落地后3秒内不会追你。", "云可以踩。能力也能打倒。扔出来的刺球按普通方法对付。"], "es": ["Nube pinchuda", "Va en una nube un poco por delante de ti y lanza huevos de Pinchudo.", "Lanza un Pinchudo adonde estabas hace 1,5 segundos. No te persigue durante 3 segundos tras caer.", "La nube se puede pisar. Los poderes también funcionan. El Pinchudo lanzado se derrota como siempre."], "hi": ["कांटा बादल", "बादल पर सवार होकर तुमसे थोड़ा आगे चलता है और कांटेदार अंडे फेंकता है।", "तुम 1.5 सेकंड पहले जहाँ थे, वहाँ कांटेदार गोला फेंकता है। उतरने के बाद 3 सेकंड तक पीछा नहीं करता।", "बादल पर कूद सकते हो। शक्तियाँ भी काम करती हैं। फेंके गए कांटेदार को आम तरीके से हराओ।"]}}, {"id": "tsumi", "cat": "enemy", "th": ["poison", "space", "cave"], "t": {"ja": ["つみつみ", "4だんに積み重なった背の高い敵。", "体当たり。", "上から踏むと、全部いっぺんに倒せます。ファイアなどは1発で1だんずつ減らします。"], "en": ["Stackie", "A tall enemy made of four stacked pieces.", "Bumps into you.", "Stomp it from above to take out the whole stack at once. Fire and similar powers remove one piece per hit."], "zh": ["叠叠高", "由四层叠在一起的高个子敌人。", "撞过来。", "从上面踩可以一次打倒整座。火焰等能力一发只能打掉一层。"], "es": ["Apilado", "Un enemigo alto formado por cuatro piezas apiladas.", "Te embiste.", "Písalo desde arriba y caerá toda la pila de golpe. El Fuego y otros poderes quitan una pieza por impacto."], "hi": ["ढेर", "चार परतों में ऊँचा खड़ा दुश्मन।", "टकराता है।", "ऊपर से कुचलो तो सारी परतें एक साथ गिर जाती हैं। आग जैसी शक्तियाँ एक वार में एक परत हटाती हैं।"]}}, {"id": "tsubo", "cat": "enemy", "th": ["lava", "manor", "cave", "city"], "t": {"ja": ["ツボオバケ", "ツボに化けた敵。のろのろ近づいてきます。", "体当たり。", "踏む・パワーを当てると、ツボがこわれて4秒おとなしくなります。そのあいだに通り抜けましょう。4秒たつと復活します。"], "en": ["Pot Ghost", "An enemy disguised as a pot that creeps toward you.", "Bumps into you.", "Stomp it or hit it with a power to shatter the pot. It stays harmless for 4 seconds, so slip past. Then it comes back."], "zh": ["罐子怪", "伪装成罐子的敌人，慢吞吞地靠近。", "撞过来。", "踩它或用能力打它，罐子会碎掉并老实4秒，趁机通过。4秒后会复活。"], "es": ["Fantasma de vasija", "Un enemigo disfrazado de vasija que se arrastra hacia ti.", "Te embiste.", "Písalo o golpéalo con un poder para romper la vasija. Queda inofensivo 4 segundos: aprovecha para pasar. Luego se recompone."], "hi": ["मटका भूत", "मटके का वेश बनाए दुश्मन जो रेंगते हुए पास आता है।", "टकराता है।", "कुचलो या शक्ति से मारो तो मटका टूट जाता है और 4 सेकंड तक बेअसर रहता है, तब आगे निकल जाओ। फिर वह वापस आ जाता है।"]}}, {"id": "bokka", "cat": "enemy", "th": ["lava"], "t": {"ja": ["ボッカ", "マグマの国にすむ、ひょうきんな敵。左右に動き、ぴょんぴょん跳ねます。", "山なりの火の玉を投げてきます。少し先を読んで投げてきます。", "上から踏めます。パワーでも倒せます。"], "en": ["Bokka", "A jumpy enemy from the magma land that sways side to side.", "Lobs fireballs in an arc, aiming slightly ahead of your movement.", "You can stomp it. Powers work too."], "zh": ["砰卡", "住在岩浆地带的滑稽敌人，左右移动并不停蹦跳。", "抛出弧线火球，会稍微预判你的移动。", "可以踩。能力也能打倒。"], "es": ["Bokka", "Un enemigo saltarín de la tierra de magma que se mueve de lado a lado.", "Lanza bolas de fuego en arco, apuntando un poco por delante de ti.", "Se puede pisar. Los poderes también funcionan."], "hi": ["बोका", "लावा की दुनिया का उछलने वाला दुश्मन जो दाएँ-बाएँ हिलता रहता है।", "आग के गोले को चाप में फेंकता है और तुम्हारी चाल को थोड़ा आगे तक भाँप लेता है।", "कूदकर कुचल सकते हो। शक्तियाँ भी काम करती हैं।"]}}, {"id": "bonbori", "cat": "enemy", "th": ["manor"], "t": {"ja": ["ボンボリ", "ふわふわ浮かぶ、ちょうちんの幽霊。", "見つめていると止まり、目をそらすと近づいてきます。", "踏めません。見つめて止めてから、パワーを当てます。"], "en": ["Lantern Ghost", "A floating paper-lantern ghost.", "Freezes while you look at it and creeps closer when you look away.", "It cannot be stomped. Stare it down to stop it, then hit it with a power."], "zh": ["灯笼鬼", "飘在空中的灯笼幽灵。", "你盯着它时会停住，一移开视线就靠近。", "不能踩。先盯着让它停下，再用能力攻击。"], "es": ["Fantasma farolillo", "Un fantasma de farolillo que flota en el aire.", "Se detiene si lo miras y se acerca si apartas la vista.", "No se puede pisar. Mantén la mirada para detenerlo y golpéalo con un poder."], "hi": ["लालटेन भूत", "हवा में तैरता कागज़ी लालटेन का भूत।", "देखते रहो तो रुक जाता है, नज़र हटाते ही पास आ जाता है।", "कुचल नहीं सकते। उसे घूरकर रोको, फिर शक्ति से मारो।"]}}, {"id": "kaiga", "cat": "enemy", "th": ["manor"], "t": {"ja": ["とびだすえ", "壁にかかった絵。ふだんは、ただの飾りです。", "近づくと壁から飛び出して、プレイヤーめがけて飛んできます。", "飛び出した絵は、踏むか、パワーで倒せます。壁にかかっている間は、さわっても平気です。"], "en": ["Haunted Portrait", "A painting on the wall that looks like plain decoration.", "Leaps off the wall when you get close and flies at you.", "Stomp it or hit it with a power once it flies out. It is harmless while it hangs on the wall."], "zh": ["跳出的画", "挂在墙上的画，平时只是装饰。", "你靠近时会从墙上飞出来扑向你。", "飞出来之后，可以踩它或用能力打倒。挂在墙上时碰到也没事。"], "es": ["Retrato embrujado", "Un cuadro colgado en la pared que parece solo decoración.", "Salta de la pared cuando te acercas y vuela hacia ti.", "Písalo o golpéalo con un poder cuando salga volando. Colgado en la pared es inofensivo."], "hi": ["भूतिया तस्वीर", "दीवार पर टँगी तस्वीर, जो आम सजावट जैसी लगती है।", "पास जाने पर दीवार से निकलकर तुम्हारी ओर उड़ती है।", "निकलने के बाद कुचलो या शक्ति से मारो। दीवार पर टँगी हो तब छूने से कोई नुकसान नहीं।"]}}, {"id": "kabe", "cat": "enemy", "th": ["all"], "t": {"ja": ["カベグル", "ブロックの壁や床をはって動く虫。", "体当たり。", "上の面にいるときは踏んで倒せます。パワーでも倒せます。"], "en": ["Wall Crawler", "A bug that crawls along block walls and floors.", "Bumps into you.", "Stomp it when it is on a top surface. Powers work too."], "zh": ["爬墙虫", "沿着方块的墙面和地面爬行的虫子。", "撞过来。", "它在顶面时可以踩扁。能力也能打倒。"], "es": ["Trepamuros", "Un bicho que se arrastra por las paredes y suelos de los bloques.", "Te embiste.", "Písalo cuando esté en una cara superior. Los poderes también funcionan."], "hi": ["दीवार रेंगू", "ब्लॉक की दीवारों और फ़र्श पर रेंगने वाला कीड़ा।", "टकराता है।", "जब वह ऊपरी सतह पर हो तब कुचल सकते हो। शक्तियाँ भी काम करती हैं।"]}}, {"id": "togeguru", "cat": "enemy", "th": ["all"], "t": {"ja": ["トゲグル", "とげのついた、はいまわる虫。", "体当たり。とげがあるので、どの面でも踏めません。", "パワーで倒します。"], "en": ["Spiny Crawler", "A spiny bug that crawls around.", "Bumps into you. It has spikes, so it cannot be stomped from any side.", "Beat it with a power."], "zh": ["刺爬虫", "带刺的爬行虫。", "撞过来。身上有刺，任何一面都不能踩。", "用能力打倒。"], "es": ["Trepapúas", "Un bicho con pinchos que se arrastra.", "Te embiste. Tiene púas, así que no se puede pisar por ningún lado.", "Derrótalo con un poder."], "hi": ["काँटा रेंगू", "काँटों वाला रेंगने वाला कीड़ा।", "टकराता है। काँटे होने से किसी भी तरफ़ से कुचल नहीं सकते।", "शक्ति से हराओ।"]}}, {"id": "goronbo", "cat": "enemy", "th": ["forest", "lava", "ice", "space", "cave", "desert"], "t": {"ja": ["ゴロンボ", "じっとしている、まるい岩。", "近づくと、うなって力をため、そのあと猛スピードで転がってきます。かべにぶつかると爆発します。ほかの敵も巻きこみます。", "踏めません。転がり出したら横へよけましょう。パワーで倒せます。"], "en": ["Rollo", "A round rock that sits still.", "When you come near, it revs up and then rolls at high speed. It explodes when it hits a wall, and it knocks out other enemies on the way.", "It cannot be stomped. Step aside once it starts rolling. Powers beat it."], "zh": ["滚滚岩", "一动不动的圆岩石。", "你靠近时会蓄力，然后高速滚过来。撞到墙会爆炸，路上的其他敌人也会被撞倒。", "不能踩。它开始滚动后向旁边躲开。能力可以打倒它。"], "es": ["Rodabo", "Una roca redonda que está quieta.", "Cuando te acercas, se prepara y luego rueda a toda velocidad. Explota al chocar con una pared y se lleva por delante a otros enemigos.", "No se puede pisar. Apártate cuando empiece a rodar. Los poderes lo derrotan."], "hi": ["गोरोन्बो", "चुपचाप पड़ी गोल चट्टान।", "पास जाने पर ज़ोर लगाती है और फिर तेज़ रफ़्तार से लुढ़कती आती है। दीवार से टकराकर फट जाती है और रास्ते के दूसरे दुश्मनों को भी गिरा देती है।", "कुचल नहीं सकते। जब वह लुढ़कना शुरू करे तो बगल में हट जाओ। शक्तियों से हारती है।"]}}, {"id": "jfish", "cat": "enemy", "th": ["sea"], "t": {"ja": ["とびうお", "水やマグマの下から、いきなり飛び出してくる魚。", "水面から高くジャンプして、体当たりしてきます。", "水の中にいる間は、さわれません。飛び出した瞬間に、踏むかパワーで倒します。"], "en": ["Leaper Fish", "A fish that suddenly jumps out from beneath the water.", "Leaps high out of the water and slams into you.", "It cannot be touched while it is underwater. Stomp it or hit it with a power as soon as it jumps out."], "zh": ["跳跳鱼", "会突然从水下跳出来的鱼。", "从水面高高跃起撞向你。", "它在水里时碰不到。在它跳出来的瞬间踩它或用能力打倒。"], "es": ["Pez saltarín", "Un pez que salta de repente desde debajo del agua.", "Salta alto fuera del agua y te embiste.", "No se puede tocar mientras está bajo el agua. Písalo o golpéalo con un poder en cuanto salte."], "hi": ["कूदू मछली", "पानी के नीचे से अचानक कूद पड़ने वाली मछली।", "पानी से ऊँचा कूदकर टकराती है।", "पानी के अंदर रहने तक उसे छू नहीं सकते। कूदते ही कुचलो या शक्ति से मारो।"]}}, {"id": "kurage", "cat": "enemy", "th": ["sea"], "t": {"ja": ["クラゲ", "ゆらゆら浮かぶクラゲ。", "近づくと、ゆっくり追いかけてきて、さわるとビリッとします。", "踏めません。パワーで倒します。"], "en": ["Jellyfish", "A jellyfish drifting up and down.", "Slowly follows you when you are near and shocks you on touch.", "It cannot be stomped. Beat it with a power."], "zh": ["水母", "摇摇晃晃漂浮的水母。", "你靠近时会慢慢追过来，碰到会触电。", "不能踩。用能力打倒。"], "es": ["Medusa", "Una medusa que flota meciéndose.", "Te sigue despacio si te acercas y te da una descarga al tocarla.", "No se puede pisar. Derrótala con un poder."], "hi": ["जेलीफ़िश", "ऊपर-नीचे तैरती जेलीफ़िश।", "पास जाने पर धीरे-धीरे पीछा करती है, छूने पर करंट मारती है।", "कुचल नहीं सकते। शक्ति से हराओ।"]}}, {"id": "ika", "cat": "enemy", "th": ["sea"], "t": {"ja": ["イカスミン", "水辺や地面からぬっと出てくる、イカ。", "すみをはきます。当たると、しばらく画面が見えにくくなります。", "出てきている間に、踏むか、パワーで倒します。かくれている間は倒せません。"], "en": ["Inkling", "A squid that pops up from the water or the ground.", "Spits ink. If it hits you, your view is blocked for a while.", "Stomp it or hit it with a power while it is up. It cannot be hurt while hiding."], "zh": ["墨墨鱿", "从水边或地面里冒出来的鱿鱼。", "会喷墨。被喷到后，一段时间内视野会被遮住。", "它冒出来时，踩它或用能力打倒。躲起来时打不到。"], "es": ["Calamarín", "Un calamar que asoma desde el agua o el suelo.", "Escupe tinta. Si te alcanza, no ves bien durante un rato.", "Písalo o golpéalo con un poder mientras está fuera. No se le puede dañar cuando se esconde."], "hi": ["स्याही स्क्विड", "पानी या ज़मीन से अचानक निकलने वाला स्क्विड।", "स्याही थूकता है। लग जाए तो कुछ देर तक सामने का दृश्य धुँधला हो जाता है।", "जब वह बाहर हो तब कुचलो या शक्ति से मारो। छिपा हो तो नहीं मार सकते।"]}}, {"id": "neba", "cat": "enemy", "th": ["poison"], "t": {"ja": ["ネバスライム", "毒のぬまにすむ、ねばねばしたスライム。", "体当たり。", "踏むと倒せますが、ねばねばがついて、4秒ほどジャンプが低くなります。パワーで倒せばだいじょうぶです。"], "en": ["Goo Slime", "A sticky slime from the poison swamp.", "Bumps into you.", "Stomping it works, but you get stuck with goo and jump lower for about 4 seconds. A power avoids that."], "zh": ["黏黏史莱姆", "住在毒沼里的黏糊糊史莱姆。", "撞过来。", "踩得死，但会被黏住，约4秒内跳不高。用能力打倒就不会被黏住。"], "es": ["Baba", "Un limo pegajoso del pantano tóxico.", "Te embiste.", "Pisarlo funciona, pero te pega y saltas menos unos 4 segundos. Con un poder te evitas eso."], "hi": ["चिपचिपा स्लाइम", "ज़हरीले दलदल में रहने वाला चिपचिपा स्लाइम।", "टकराता है।", "कुचलने से हार जाता है, पर तुम चिपचिपे हो जाते हो और करीब 4 सेकंड ऊँचा नहीं कूद पाते। शक्ति से मारोगे तो यह नहीं होगा।"]}}, {"id": "penguin", "cat": "enemy", "th": ["ice"], "t": {"ja": ["ペンギン", "氷の世界を歩く、ペンギン。", "近づくと、おなかで氷の上をすべって突進してきます。", "すべっているときも、上から踏めます。パワーでも倒せます。"], "en": ["Penguin", "A penguin that waddles across the icy world.", "When you get close, it belly-slides at you across the ice.", "You can stomp it even while it slides. Powers work too."], "zh": ["企鹅", "走在冰雪世界里的企鹅。", "你靠近时会用肚子在冰上滑行冲过来。", "滑行时也能从上面踩它。能力也能打倒。"], "es": ["Pingüino", "Un pingüino que camina por el mundo helado.", "Si te acercas, se lanza deslizándose sobre la barriga.", "Se puede pisar incluso mientras se desliza. Los poderes también funcionan."], "hi": ["पेंगुइन", "बर्फ़ीली दुनिया में चलने वाला पेंगुइन।", "पास जाने पर पेट के बल बर्फ़ पर फिसलते हुए टकराने आता है।", "फिसलते समय भी ऊपर से कुचल सकते हो। शक्तियाँ भी काम करती हैं।"]}}, {"id": "snowball", "cat": "enemy", "th": ["ice"], "t": {"ja": ["ゆきだま", "ユキダルマンが転がしてくる雪玉。", "まっすぐ転がってきて、だんだん大きくなります。", "踏めません。よけましょう。かべにぶつかるとくだけます。"], "en": ["Snowball", "A snowball rolled out by Snowman King.", "Rolls straight ahead and keeps growing.", "It cannot be stomped. Dodge it. It shatters when it hits a wall."], "zh": ["雪球", "雪人王滚出来的雪球。", "笔直滚过来，越滚越大。", "不能踩。躲开它。撞到墙就会碎掉。"], "es": ["Bola de nieve", "Una bola de nieve que hace rodar el Rey Muñeco de Nieve.", "Rueda en línea recta y va creciendo.", "No se puede pisar. Esquívala. Se rompe al chocar con una pared."], "hi": ["बर्फ़ का गोला", "बर्फ़ का राजा द्वारा लुढ़काया गया बर्फ़ का गोला।", "सीधा लुढ़कता है और धीरे-धीरे बड़ा होता जाता है।", "कुचल नहीं सकते। बचकर निकलो। दीवार से टकराकर टूट जाता है।"]}}, {"id": "ufo", "cat": "enemy", "th": ["space"], "t": {"ja": ["UFO", "宇宙にうかぶ、ふしぎな円ばん。ダメージはありません。", "真下に来たプレイヤーを光で空中に吸い上げて、約3秒のあいだ動けなくします。そのあと2.5秒は、吸い上げません。", "さわってもダメージはありません。吸い上げられている間も攻撃はできるので、真上にパワーを撃てば倒せます。ひくく飛んでいるので、ジャンプで踏んでも倒せます。"], "en": ["UFO", "A mysterious saucer floating in space. It does no damage.", "Lifts you into the air with its beam when you are right under it and holds you still for about 3 seconds. It will not grab you again for 2.5 seconds.", "Touching it does no damage. You can still attack while held, so shoot a power straight up. It flies low, so you can also jump and stomp it."], "zh": ["UFO", "漂浮在宇宙中的神秘飞碟。不会造成伤害。", "你走到它正下方时，会用光束把你吸到空中，并让你动弹不得约3秒。之后2.5秒内不会再吸你。", "碰到也不会受伤。被吸住时仍能攻击，所以对着正上方发射能力就能打倒。它飞得低，跳起来踩也能打倒。"], "es": ["OVNI", "Un misterioso platillo que flota en el espacio. No hace daño.", "Te eleva con su rayo cuando estás justo debajo y te deja inmóvil unos 3 segundos. Después, 2,5 segundos sin atraparte.", "Tocarlo no hace daño. Aún puedes atacar mientras te sujeta, así que dispara un poder hacia arriba. Vuela bajo, así que también puedes saltar y pisarlo."], "hi": ["UFO", "अंतरिक्ष में तैरती रहस्यमयी उड़न तश्तरी। यह नुकसान नहीं पहुँचाती।", "ठीक नीचे आने पर किरण से तुम्हें हवा में खींच लेती है और करीब 3 सेकंड तक हिलने नहीं देती। इसके बाद 2.5 सेकंड तक नहीं पकड़ती।", "छूने से कोई नुकसान नहीं। पकड़े जाने पर भी हमला कर सकते हो, इसलिए सीधे ऊपर शक्ति चलाओ। यह नीचे उड़ती है, इसलिए कूदकर कुचल भी सकते हो।"]}}, {"id": "raincloud", "cat": "enemy", "th": ["sky"], "t": {"ja": ["かみなりぐも", "空にうかぶ、雷をためた雲。", "プレイヤーの少し先をゆっくり追いかけて、1.5秒の予告(光る輪)のあと、真下に雷を落とします。予告のあいだは、その場でとまります。", "予告の輪から離れれば、雷はよけられます。雲は踏めます。パワーでも倒せます。"], "en": ["Thundercloud", "A cloud in the sky charged with lightning.", "Slowly trails a little ahead of you, shows a glowing ring for 1.5 seconds, then drops lightning straight down. It stays still during the warning.", "Step away from the warning ring to dodge the bolt. You can stomp the cloud. Powers work too."], "zh": ["雷云", "飘在空中蓄满雷电的云。", "慢慢跟在你前方不远处，显示1.5秒的光圈预告后，向正下方落雷。预告期间它会停在原地。", "离开预告光圈就能躲开雷击。云可以踩。能力也能打倒。"], "es": ["Nube de tormenta", "Una nube cargada de rayos que flota en el cielo.", "Te sigue despacio un poco por delante, muestra un anillo brillante 1,5 segundos y luego lanza un rayo hacia abajo. Se queda quieta durante el aviso.", "Aléjate del anillo de aviso para esquivar el rayo. La nube se puede pisar. Los poderes también funcionan."], "hi": ["बिजली बादल", "आसमान में बिजली भरे तैरते बादल।", "तुमसे थोड़ा आगे धीरे-धीरे पीछा करता है, 1.5 सेकंड तक चमकता घेरा दिखाता है और फिर ठीक नीचे बिजली गिराता है। चेतावनी के दौरान वह अपनी जगह रुका रहता है।", "चेतावनी के घेरे से हट जाओ तो बिजली से बच जाओगे। बादल पर कूद सकते हो। शक्तियाँ भी काम करती हैं।"]}}, {"id": "hinotama", "cat": "enemy", "th": ["lava"], "t": {"ja": ["ひのたま", "マグマからとび出してくる、炎のかたまり。", "マグマから高くとび上がって、また落ちていきます。", "踏めません。アイスやサンダーなどのパワーで倒せます。マグマにもぐっているあいだは当たりません。"], "en": ["Fireball Sprite", "A blob of flame that leaps out of the magma.", "Jumps high out of the lava and then falls back in.", "It cannot be stomped. Beat it with Ice, Thunder or another power. It cannot be hit while it is under the lava."], "zh": ["火球精", "从岩浆里蹿出来的火焰团。", "从岩浆里高高跳起，再落回去。", "不能踩。用冰冻、雷电等能力打倒。它潜在岩浆里时打不到。"], "es": ["Bola de llama", "Una llamarada que salta desde el magma.", "Salta alto fuera de la lava y vuelve a caer.", "No se puede pisar. Derrótala con Hielo, Rayo u otro poder. No se la puede golpear mientras está bajo la lava."], "hi": ["आग का गोला", "लावा से उछलकर निकलने वाला लपटों का गोला।", "लावा से ऊँचा उछलता है और फिर वापस गिर जाता है।", "कुचल नहीं सकते। बर्फ़, बिजली या दूसरी शक्ति से हराओ। लावा के अंदर रहते समय उसे नहीं मार सकते।"]}}, {"id": "mimic", "cat": "enemy", "th": ["all"], "t": {"ja": ["にせコイン", "コインにそっくりな、ばけもの。", "近づくと正体をあらわして、すばやく追いかけてきます。", "正体をあらわす前でも、パワーで倒せます。あらわしたら、踏んでも倒せます。"], "en": ["Fake Coin", "A monster that looks exactly like a coin.", "Reveals itself when you get close and chases you fast.", "Powers work even before it reveals itself. Once revealed, you can also stomp it."], "zh": ["假金币", "和金币一模一样的怪物。", "你靠近时会现出原形，并快速追过来。", "即使它还没现形，也能用能力打倒。现形后也可以踩。"], "es": ["Moneda falsa", "Un monstruo idéntico a una moneda.", "Se revela cuando te acercas y te persigue rápido.", "Los poderes funcionan incluso antes de que se revele. Una vez revelada, también puedes pisarla."], "hi": ["नकली सिक्का", "बिलकुल सिक्के जैसा दिखने वाला राक्षस।", "पास जाने पर असली रूप दिखाता है और तेज़ी से पीछा करता है।", "असली रूप दिखाने से पहले भी शक्तियाँ काम करती हैं। रूप दिखा दे तो कूदकर कुचल भी सकते हो।"]}}, {"id": "crow", "cat": "enemy", "th": ["forest", "poison", "manor", "city"], "t": {"ja": ["カラス", "うしろから、ねらってくる黒いカラス。", "警告の音のあと、プレイヤーの足もとをめがけて、ゆっくり飛んでぶつかってきます。", "ジャンプで上から踏むか、向きを変えてパワーで倒します。サンダーは、ねらった方向へまっすぐ飛ぶので当てやすいです。"], "en": ["Crow", "A black crow that attacks from behind.", "After a warning sound, it flies slowly toward your feet and dives into you.", "Jump and stomp it from above, or turn around and hit it with a power. Thunder flies straight where you aim, so it is easy to land."], "zh": ["乌鸦", "会从背后袭来的黑乌鸦。", "发出警告声后，朝你的脚下慢慢飞来撞击。", "跳起来从上面踩它，或转身用能力打倒。雷电会朝瞄准的方向直飞，很容易命中。"], "es": ["Cuervo", "Un cuervo negro que ataca por la espalda.", "Tras un aviso sonoro, vuela despacio hacia tus pies y se lanza contra ti.", "Salta y písalo desde arriba, o date la vue   var LANGS = ['ja', 'en', 'zh', 'es', 'hi'];

  function detect() {

        '<div class="sec"><b>' + esc(U.intro) + '</b><p>' + esc(t[1]) + '</p></div>' +

        '<div class="sec"><b>' + esc(U.how) + '</b><p>' + esc(t[3]) + '</p></div></article>';
    }).join('');
  }
  document.getElementById('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (!b) return; tab = b.getAttribute('data-t'); render(); });

  lang = detect(); document.getElementById('lang').value = lang; render();
